<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>貓咪健康日記</title><style>:root{--blue:#86a9c1;--ink:#39454b;--cream:#f8f5ee;--soft:#eef2f2}*{box-sizing:border-box}body{margin:0;background:#e9e8e3;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif}.app{max-width:480px;min-height:100dvh;margin:auto;background:var(--cream);padding:22px 18px 100px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:23px;letter-spacing:2px;margin:8px 0 20px}h2{font-size:19px;margin:6px 0 14px}.muted{color:#879096;font-size:13px}.cats{display:flex;gap:14px;overflow-x:auto;padding:4px 0 18px}.cat{min-width:70px;text-align:center;border:0;background:none;color:inherit}.cat img{width:66px;height:66px;border-radius:50%;object-fit:cover;border:3px solid transparent}.cat.active img{border-color:#76a7c9}.cat span{display:block;margin-top:4px}.plus{width:66px;height:66px;border-radius:50%;background:#e6edf1;display:grid;place-items:center;font-size:30px;color:#6f9ab6}.hero{display:flex;gap:15px;align-items:center;margin-bottom:15px}.hero img{width:46%;aspect-ratio:1/1.2;object-fit:cover;border-radius:20px}.hero strong{font-size:26px}.card{background:white;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 4px 16px #65727c10}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{background:#f3f6f7;border-radius:15px;padding:14px;text-align:center}.stat b{font-size:23px}.bar{height:10px;background:#e6ebed;border-radius:20px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:#9fc0d9;width:0}.bar.peach i{background:#e8bb93}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);background:#fffdf9;display:flex;justify-content:space-around;padding:10px 4px max(12px,env(safe-area-inset-bottom));box-shadow:0 -3px 18px #0000000b}.nav button{border:0;background:transparent;color:#7f8588;font-size:12px;padding:8px 10px;border-radius:12px}.nav button.on{background:#e6eff4;color:#477fa5}.nav em{display:block;font-size:22px;font-style:normal}button.primary{border:0;border-radius:30px;background:var(--blue);color:white;padding:13px 20px;font-size:15px;width:100%;margin-top:12px}button.small{border:0;border-radius:15px;background:#e8eff3;padding:9px 12px;color:#497a9c}input,select,textarea{width:100%;padding:12px;border:1px solid #d9dfe0;border-radius:12px;background:white;font-size:16px;margin:5px 0 13px}label{font-size:14px;display:block}.entry{border-bottom:1px solid #edf0f1;padding:12px 0}.entry:last-child{border:0}.hidden{display:none}.notice{font-size:12px;color:#8c9397;line-height:1.7}.pill{display:inline-block;padding:5px 10px;background:#e9f0f3;border-radius:15px;font-size:12px}.empty{padding:22px;text-align:center;color:#8b969b}.section-title{font-size:14px;color:#879096;margin:20px 0 8px}.delete{border:0;background:none;color:#ad7e7e;font-size:12px}</style></head><body><main class="app"><header><h1>貓咪健康日記 🐾</h1><button class="small" onclick="manageCats()">多貓管理 ⚙</button></header><div class="cats" id="cats"></div><section id="content"></section></main><nav class="nav" id="nav"></nav><script>
const KEY='cat-health-diary-v1';const demo={cats:[{id:'didi',name:'Didi',age:'3 歲',weight:3.8,photo:'didi.jpg'}],selected:'didi',foods:[],meals:[],water:[],weights:[],health:[],medical:[]};let state;try{state=JSON.parse(localStorage.getItem(KEY))||demo}catch{state=demo}let tab='today';const today=()=>new Date().toLocaleDateString('sv-SE');const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);const cat=()=>state.cats.find(c=>c.id===state.selected);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>Number(n||0).toFixed(1).replace(/\.0$/,'');function render(){document.getElementById('cats').innerHTML=state.cats.map(c=>`<button class="cat ${c.id===state.selected?'active':''}" onclick="selectCat('${c.id}')"><img src="${esc(c.photo||'')}" onerror="this.style.opacity=.25"><span>${esc(c.name)}</span></button>`).join('')+`<button class="cat" onclick="formCat()"><span class="plus">＋</span><span>新增貓咪</span></button>`;let tabs=[['today','⌂','今日'],['meals','▤','照顧紀錄'],['foods','▣','食品庫'],['health','♡','健康'],['medical','♧','醫療'],['stats','▥','統計']];document.getElementById('nav').innerHTML=tabs.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="go('${t[0]}')"><em>${t[1]}</em>${t[2]}</button>`).join('');document.getElementById('content').innerHTML=({today:todayPage,meals:mealsPage,foods:foodsPage,health:healthPage,medical:medicalPage,stats:statsPage}[tab])()};function go(t){tab=t;render()}function selectCat(id){state.selected=id;save();render()}function photoFile(input,callback){let file=input.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{let im=new Image();im.onload=()=>{let canvas=document.createElement('canvas');let scale=Math.min(1,650/Math.max(im.width,im.height));canvas.width=Math.round(im.width*scale);canvas.height=Math.round(im.height*scale);canvas.getContext('2d').drawImage(im,0,0,canvas.width,canvas.height);callback(canvas.toDataURL('image/jpeg',.72))};im.src=reader.result};reader.readAsDataURL(file)}function formCat(){document.getElementById('content').innerHTML=`<div class="card"><h2>新增貓咪</h2><form id="catForm"><label>名字<input name="name" required maxlength="30"></label><label>年齡（可留空）<input name="age" placeholder="例如：3 歲"></label><label>體重 kg（可留空）<input name="weight" type="number" min="0" step="0.01"></label><label>貓咪照片<input id="catPhoto" type="file" accept="image/*"></label><button class="primary">儲存貓咪</button></form></div>`;document.getElementById('catForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),c={id:uid(),name:f.get('name'),age:f.get('age'),weight:Number(f.get('weight'))||null,photo:''};let file=document.getElementById('catPhoto');const done=()=>{state.cats.push(c);state.selected=c.id;try{save();go('today')}catch{alert('照片太大，請換一張較小的照片')}};file.files.length?photoFile(file,p=>{c.photo=p;done()}):done()}}function manageCats(){document.getElementById('content').innerHTML=`<h2>多貓管理</h2><p class="notice">可以修改貓咪基本資料、照片與目前體重。刪除貓咪會連同該貓的本機飲食、飲水與體重紀錄一起刪除，且無法復原。</p>${state.cats.map(c=>`<div class="card"><div class="row"><b>${esc(c.name)}</b><span>${c.weight?fmt(c.weight)+' kg':'未設定體重'}</span></div><div class="row" style="margin-top:12px"><button class="small" onclick="editCat('${c.id}')">編輯資料</button><button class="delete" onclick="deleteCat('${c.id}')">刪除貓咪</button></div></div>`).join('')}`}
function editCat(id){let c=state.cats.find(x=>x.id===id);if(!c)return;document.getElementById('content').innerHTML=`<div class="card"><h2>編輯 ${esc(c.name)}</h2><form id="editCatForm"><label>名字<input name="name" required maxlength="30" value="${esc(c.name)}"></label><label>年齡<input name="age" value="${esc(c.age||'')}"></label><label>目前體重 kg<input name="weight" type="number" min="0" step="0.01" value="${c.weight??''}"></label><label>更換照片（不選擇則保留原照片）<input id="editPhoto" type="file" accept="image/*"></label><button class="primary">儲存修改</button><button type="button" class="small" onclick="manageCats()">返回</button></form></div>`;document.getElementById('editCatForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),next={...c,name:String(f.get('name')).trim(),age:String(f.get('age')),weight:f.get('weight')===''?null:Number(f.get('weight'))};let file=document.getElementById('editPhoto');let done=()=>{let index=state.cats.findIndex(x=>x.id===id);let old=state.cats[index];state.cats[index]=next;try{save();manageCats();render();manageCats()}catch(err){state.cats[index]=old;alert('儲存失敗，可能是照片太大或瀏覽器空間不足。')}};file.files.length?photoFile(file,p=>{next.photo=p;done()}):done()}}
function deleteCat(id){let c=state.cats.find(x=>x.id===id);if(!c)return;if(!confirm(`確定永久刪除「${c.name}」以及牠的所有本機紀錄嗎？此操作無法復原。`))return;state.cats=state.cats.filter(x=>x.id!==id);for(let type of ['meals','water','weights','health','medical'])state[type]=state[type].filter(x=>x.cat!==id);if(state.selected===id)state.selected=state.cats[0]?.id||null;save();render();manageCats()}
function deleteWeight(id){if(!confirm('確定刪除此筆體重紀錄？'))return;state.weights=state.weights.filter(x=>x.id!==id);let ws=state.weights.filter(x=>x.cat===state.selected).sort((a,b)=>b.date.localeCompare(a.date));if(ws.length)cat().weight=ws[0].kg;save();go('health')}
function editWeight(id){let x=state.weights.find(x=>x.id===id);if(!x)return;document.getElementById('content').innerHTML=`<div class="card"><h2>修改體重紀錄</h2><form id="editWeightForm"><label>日期<input name="date" type="date" value="${x.date}" required></label><label>體重 kg<input name="kg" type="number" min="0.01" step="0.01" value="${x.kg}" required></label><button class="primary">儲存修改</button></form></div>`;document.getElementById('editWeightForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);x.date=f.get('date');x.kg=Number(f.get('kg'));let ws=state.weights.filter(y=>y.cat===state.selected).sort((a,b)=>b.date.localeCompare(a.date));if(ws.length)cat().weight=ws[0].kg;save();go('health')}}
function todayData(){let m=state.meals.filter(x=>x.cat===state.selected&&x.date===today());let w=state.water.filter(x=>x.cat===state.selected&&x.date===today());return {m,cal:m.reduce((s,x)=>s+x.kcal,0),foodWater:m.reduce((s,x)=>s+x.water,0),drinks:w.reduce((s,x)=>s+x.ml,0)}}function todayPage(){let c=cat(),d=todayData();if(!c)return '<div class="empty">請先新增貓咪</div>';return `<div class="hero"><img src="${esc(c.photo||'')}" onerror="this.style.display='none'"><div><strong>${esc(c.name)}</strong><p class="muted">${esc(c.age||'年齡未設定')}<br>${c.weight?fmt(c.weight)+' kg':'尚未記錄體重'}</p><span class="pill">今天也要好好吃飯</span><p><button class="small" onclick="formCat()">＋ 新增其他貓咪</button></p></div></div><div class="card"><div class="row"><h2>今日攝取摘要</h2><span class="muted">${today()}</span></div><div class="stats"><div class="stat">熱量<br><b>${fmt(d.cal)}</b><br><small>kcal</small><div class="bar peach"><i style="width:${Math.min(100,d.cal/250*100)}%"></i></div></div><div class="stat">水分<br><b>${fmt(d.foodWater+d.drinks)}</b><br><small>mL</small><div class="bar"><i style="width:${Math.min(100,(d.foodWater+d.drinks)/180*100)}%"></i></div></div></div><p class="notice">250 kcal、180 mL 僅為示意刻度，不是個別貓咪的醫療建議或建議攝取量。</p></div><div class="card"><div class="row"><div>今日餐次<br><b>${d.m.length} 餐</b></div><div>額外飲水<br><b>${fmt(d.drinks)} mL</b></div></div><button class="primary" onclick="go('meals')">＋ 新增飲食紀錄</button><button class="primary" style="background:#a8b9ac" onclick="formWater()">＋ 記錄飲水</button></div>`}function mealsPage(){let m=state.meals.filter(x=>x.cat===state.selected).sort((a,b)=>b.date.localeCompare(a.date));return `<h2>飲食紀錄</h2><button class="primary" onclick="formMeal()">＋ 新增餐次</button><div class="card">${m.length?m.map(x=>`<div class="entry"><div class="row"><b>${esc(x.food)}</b><button class="delete" onclick="remove('meals','${x.id}')">刪除</button></div><div class="muted">${x.date} · ${fmt(x.grams)} g · ${fmt(x.kcal)} kcal · 食物水分 ${fmt(x.water)} mL</div></div>`).join(''):'<div class="empty">還沒有飲食紀錄</div>'}</div>`}function formMeal(){if(!state.foods.length){alert('請先到食品庫新增一項食品');go('foods');return}document.getElementById('content').innerHTML=`<div class="card"><h2>新增餐次</h2><form id="mealForm"><label>日期<input type="date" name="date" value="${today()}" required></label><label>食品<select name="food" required>${state.foods.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label><label>吃下的重量（g）<input type="number" name="grams" step="0.1" min="0.1" required></label><button class="primary">儲存</button></form></div>`;document.getElementById('mealForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),food=state.foods.find(x=>x.id===f.get('food')),g=Number(f.get('grams'));state.meals.push({id:uid(),cat:state.selected,date:f.get('date'),food:food.name,grams:g,kcal:g*food.kcal/100,water:g*food.moisture/100,phosphorus:food.phosphorus===''?null:g*Number(food.phosphorus)/100});save();go('meals')}}function foodsPage(){return `<h2>食品資料庫</h2><button class="primary" onclick="formFood()">＋ 新增食品資料</button><div class="card">${state.foods.length?state.foods.map(x=>`<div class="entry"><div class="row"><b>${esc(x.name)}</b><button class="delete" onclick="remove('foods','${x.id}')">刪除</button></div><div class="muted">${fmt(x.kcal)} kcal/100g · 含水率 ${fmt(x.moisture)}% · 磷 ${x.phosphorus===''?'未填':fmt(x.phosphorus)+' mg/100g'}</div></div>`).join(''):'<div class="empty">請先建立常吃的罐頭或乾糧</div>'}</div>`}function formFood(){document.getElementById('content').innerHTML=`<div class="card"><h2>新增食品</h2><form id="foodForm"><label>品牌與品名<input name="name" required></label><label>熱量 kcal / 100g<input name="kcal" type="number" step="0.01" min="0" required></label><label>含水率 %<input name="moisture" type="number" step="0.01" min="0" max="100" required></label><label>磷 mg / 100g（不知道可留空）<input name="phosphorus" type="number" step="0.01" min="0"></label><p class="notice">請依產品標示填寫，切勿將每 100 kcal 的磷含量直接填入每 100 g 欄位。</p><button class="primary">儲存食品</button></form></div>`;document.getElementById('foodForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);state.foods.push({id:uid(),name:f.get('name'),kcal:Number(f.get('kcal')),moisture:Number(f.get('moisture')),phosphorus:f.get('phosphorus')});save();go('foods')}}function healthPage(){let c=cat(),ws=state.weights.filter(x=>x.cat===state.selected).sort((a,b)=>b.date.localeCompare(a.date)),w=state.water.filter(x=>x.cat===state.selected).sort((a,b)=>b.date.localeCompare(a.date));return `<h2>健康紀錄</h2><div class="card"><div class="row"><h2>體重</h2><b>${c?.weight?fmt(c.weight)+' kg':'尚未記錄'}</b></div><button class="primary" onclick="formWeight()">＋ 新增體重紀錄</button>${ws.map(x=>`<div class="entry row"><span>${x.date}　${fmt(x.kg)} kg</span><span><button class="small" onclick="editWeight('${x.id}')">修改</button> <button class="delete" onclick="deleteWeight('${x.id}')">刪除</button></span></div>`).join('')}</div><div class="card"><h2>飲水紀錄</h2><button class="primary" onclick="formWater()">＋ 記錄額外飲水</button>${w.slice(0,15).map(x=>`<div class="entry">${x.date}　${fmt(x.ml)} mL</div>`).join('')}</div><p class="notice">排泄、症狀及用藥紀錄將在下一階段加入。</p>`}function formWeight(){document.getElementById('content').innerHTML=`<div class="card"><h2>新增體重</h2><form id="weightForm"><label>日期<input name="date" type="date" value="${today()}" required></label><label>體重 kg<input name="kg" type="number" min="0.01" step="0.01" required></label><button class="primary">儲存</button></form></div>`;document.getElementById('weightForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),kg=Number(f.get('kg'));state.weights.push({id:uid(),cat:state.selected,date:f.get('date'),kg});cat().weight=kg;save();go('health')}}function formWater(){document.getElementById('content').innerHTML=`<div class="card"><h2>記錄額外飲水</h2><form id="waterForm"><label>日期<input name="date" type="date" value="${today()}" required></label><label>飲水量 mL<input name="ml" type="number" min="0.1" step="0.1" required></label><button class="primary">儲存</button></form></div>`;document.getElementById('waterForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);state.water.push({id:uid(),cat:state.selected,date:f.get('date'),ml:Number(f.get('ml'))});save();go('health')}}function medicalPage(){return `<h2>醫療紀錄</h2><div class="card"><p>這個頁面將用來整理血液檢查、回診日期與檢查報告。</p><p class="notice">目前為第一版介面預覽，尚未啟用醫療資料儲存，請勿在此輸入正式醫療紀錄。</p></div>`}function statsPage(){let m=state.meals.filter(x=>x.cat===state.selected),w=state.water.filter(x=>x.cat===state.selected),days=[...new Set([...m,...w].map(x=>x.date))].sort().slice(-7);return `<h2>統計分析</h2><div class="card"><h2>最近 7 個紀錄日</h2>${days.length?days.map(day=>{let kcal=m.filter(x=>x.date===day).reduce((s,x)=>s+x.kcal,0);let water=m.filter(x=>x.date===day).reduce((s,x)=>s+x.water,0)+w.filter(x=>x.date===day).reduce((s,x)=>s+x.ml,0);return `<div class="entry"><div class="row"><b>${day}</b><span class="muted">${fmt(kcal)} kcal · ${fmt(water)} mL</span></div><div class="bar peach"><i style="width:${Math.min(100,kcal/300*100)}%"></i></div></div>`}).join(''):'<div class="empty">累積紀錄後就能查看趨勢</div>'}<p class="notice">長條圖以 300 kcal 為顯示比例，不代表建議攝取量。進階統計圖將於後續版本加入。</p></div>`}function remove(type,id){if(!confirm('確定刪除這筆資料？'))return;state[type]=state[type].filter(x=>x.id!==id);save();render()}
// V3 additions: preserve existing localStorage key and data structure.
state.excretions ||= [];
state.supplements ||= [];
state.supplementLogs ||= [];
state.foods ||= [];
const valueOf=(f,k)=>String(f.get(k)||'').trim();
const nOrNull=(v)=>v===''?null:Number(v);
const numField=(label,name,value='',extra='')=>`<label>${label}<input name="${name}" type="number" step="any" min="0" value="${esc(value??'')}" ${extra}></label>`;
const inputField=(label,name,value='',extra='')=>`<label>${label}<input name="${name}" value="${esc(value??'')}" ${extra}></label>`;
const choose=(name,options,current)=>`<select name="${name}">${options.map(([v,l])=>`<option value="${esc(v)}" ${v===current?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
const dateTimeLocal=()=>{let d=new Date();return `${today()}T${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
function storeSafely(onSuccess){try{save();onSuccess();}catch(e){alert('儲存失敗：瀏覽器空間不足。請先備份資料，並嘗試使用較小的照片。')}}
function foodCategory(f){return f.category||'濕食'}
function foodNutrient(f,k){return f[k]===null||f[k]===undefined||f[k]===''?'未提供':fmt(f[k])}
function normalizedMineral(v,unit,kcal){if(v===''||v===null||v===undefined)return null;let x=Number(v);if(unit==='percent')return x*1000;if(unit==='per100kcal')return kcal>0?x*kcal/100:null;return x}
function mineralLabel(f,k){let v=f[k];return v===null||v===undefined||v===''?'未提供':`${fmt(v)} mg/100g`}
function foodsPage(){let cats=['全部','濕食','乾飼料','點心'];let filter=window.foodFilter||'全部';let foods=state.foods.filter(f=>filter==='全部'||foodCategory(f)===filter);return `<h2>食品資料庫</h2><button class="primary" onclick="formFood()">＋ 新增食品資料</button><div class="card"><div class="row" style="flex-wrap:wrap">${cats.map(c=>`<button class="small" style="${filter===c?'background:#86a9c1;color:white':''}" onclick="window.foodFilter='${c}';render()">${c}</button>`).join('')}</div>${foods.length?foods.map(f=>`<div class="entry"><div class="row"><div><b>${esc(f.name)}</b><br><span class="pill">${esc(foodCategory(f))}</span> <span class="muted">${esc(f.brand||'')}</span></div><div><button class="small" onclick="formFood('${f.id}')">編輯</button> <button class="delete" onclick="deleteFood('${f.id}')">刪除</button></div></div><p class="muted">熱量 ${foodNutrient(f,'kcal')} kcal/100g · 水分 ${foodNutrient(f,'moisture')}%<br>蛋白質 ${foodNutrient(f,'protein')}% · 鈉 ${mineralLabel(f,'sodium')} · 磷 ${mineralLabel(f,'phosphorus')}</p></div>`).join(''):'<div class="empty">此分類尚無食品</div>'}</div>`}
function formFood(id){let f=state.foods.find(x=>x.id===id)||{};let isEdit=!!id;let categories=[['濕食','濕食'],['乾飼料','乾飼料'],['點心','點心']];let units=[['per100g','mg／100g'],['per100kcal','mg／100kcal'],['percent','%']];document.getElementById('content').innerHTML=`<div class="card"><h2>${isEdit?'編輯':'新增'}食品</h2><form id="foodForm"><label>食品分類${choose('category',categories,foodCategory(f))}</label>${inputField('品牌','brand',f.brand||'')}${inputField('品名（必填）','name',f.name||'','required')}${inputField('口味','flavor',f.flavor||'')}${numField('包裝重量 g','packageWeight',f.packageWeight)}${numField('熱量 kcal／100g（必填）','kcal',f.kcal,'required')}${numField('含水率 %（必填）','moisture',f.moisture,'max="100" required')}${numField('粗蛋白質 %','protein',f.protein,'max="100"')}${numField('粗脂肪 %','fat',f.fat,'max="100"')}<label>磷含量（可留空）<input name="phosInput" type="number" min="0" step="any" value="${esc(f.phosphorusInput??f.phosphorus??'')}"></label><label>磷標示單位${choose('phosUnit',units,f.phosphorusUnit||'per100g')}</label><label>鈉含量（可留空）<input name="sodiumInput" type="number" min="0" step="any" value="${esc(f.sodiumInput??f.sodium??'')}"></label><label>鈉標示單位${choose('sodiumUnit',units,f.sodiumUnit||'per100g')}</label><p class="notice">磷、鈉保留原始輸入值與單位，並換算為 mg／100g。沒有資料請留空，勿填 0。蛋白質、脂肪以產品標示百分比輸入。</p><button class="primary">儲存食品</button><button type="button" class="small" onclick="go('foods')">取消</button></form></div>`;document.getElementById('foodForm').onsubmit=e=>{e.preventDefault();let d=new FormData(e.target),kcal=Number(d.get('kcal'));let p=valueOf(d,'phosInput'),so=valueOf(d,'sodiumInput'),pu=valueOf(d,'phosUnit'),su=valueOf(d,'sodiumUnit');let next={...f,id:id||uid(),category:valueOf(d,'category'),brand:valueOf(d,'brand'),name:valueOf(d,'name'),flavor:valueOf(d,'flavor'),packageWeight:nOrNull(valueOf(d,'packageWeight')),kcal,moisture:Number(d.get('moisture')),protein:nOrNull(valueOf(d,'protein')),fat:nOrNull(valueOf(d,'fat')),phosphorusInput:p,phosphorusUnit:pu,phosphorus:normalizedMineral(p,pu,kcal),sodiumInput:so,sodiumUnit:su,sodium:normalizedMineral(so,su,kcal)};if((p&&next.phosphorus===null)||(so&&next.sodium===null)){alert('使用 mg／100kcal 單位時，熱量必須大於 0。');return}if(isEdit)state.foods[state.foods.findIndex(x=>x.id===id)]=next;else state.foods.push(next);storeSafely(()=>go('foods'))}}
function deleteFood(id){if(!confirm('確定刪除這項食品？已記錄的餐次會保留原有數值。'))return;state.foods=state.foods.filter(x=>x.id!==id);storeSafely(()=>go('foods'))}
function excretionPage(){let list=state.excretions.filter(x=>x.cat===state.selected).sort((a,b)=>b.dateTime.localeCompare(a.dateTime));let d=today();let daily=list.filter(x=>x.dateTime.slice(0,10)===d);let sums=t=>daily.filter(x=>x.type===t).reduce((n,x)=>n+Number(x.count||0),0);return `<div class="card"><div class="row"><h2>排泄紀錄</h2><span class="muted">今日：尿尿 ${sums('urine')} 次／大便 ${sums('stool')} 次</span></div><button class="primary" onclick="formExcretion('urine')">＋ 記錄尿尿</button><button class="primary" style="background:#a8b9ac" onclick="formExcretion('stool')">＋ 記錄大便</button><p class="notice">可逐次紀錄，也可以在晚上補登當日次數；同一天重複輸入會累加，請避免重複登記。</p>${list.length?list.map(x=>`<div class="entry"><div class="row"><b>${x.type==='urine'?'尿尿':'大便'} ${fmt(x.count)} 次</b><span><button class="small" onclick="formExcretion('${x.type}','${x.id}')">編輯</button> <button class="delete" onclick="deleteExcretion('${x.id}')">刪除</button></span></div><span class="muted">${esc(x.dateTime.replace('T',' '))} · ${esc(x.condition||'未記錄狀態')}</span>${x.abnormal?`<p>異常：${esc(x.abnormal)}</p>`:''}${x.notes?`<p>${esc(x.notes)}</p>`:''}${x.photo?`<img alt="排泄紀錄照片" src="${x.photo}" style="max-width:100%;max-height:220px;object-fit:contain;border-radius:12px;margin-top:8px">`:''}</div>`).join(''):'<p class="empty">尚無排泄紀錄</p>'}</div>`}
function formExcretion(type,id){let x=state.excretions.find(y=>y.id===id)||{};let options=type==='urine'?[['','未指定'],['少','少'],['正常','正常'],['多','多'],['不確定','不確定']]:[['','未指定'],['偏硬','偏硬'],['正常','正常'],['偏軟','偏軟'],['水便','水便']];document.getElementById('content').innerHTML=`<div class="card"><h2>${id?'編輯':'新增'}${type==='urine'?'尿尿':'大便'}紀錄</h2><form id="excretionForm"><label>日期與時間<input name="dateTime" type="datetime-local" value="${esc(x.dateTime||dateTimeLocal())}" required></label>${numField('次數（逐次或當日總數）','count',x.count||1,'min="1" step="1" required')}<label>${type==='urine'?'尿量':'糞便狀態'}${choose('condition',options,x.condition||'')}</label><label>顏色${choose('color',[['','未指定'],['正常','正常'],['偏深','偏深'],['偏黑','偏黑'],['偏紅','偏紅／粉紅'],['其他','其他']],x.color||'')}</label>${inputField('異常狀況（選填）','abnormal',x.abnormal||'')}<label>備註<textarea name="notes">${esc(x.notes||'')}</textarea></label><label>照片（選填）<input id="excretionPhoto" type="file" accept="image/*"></label>${x.photo?'<label><input type="checkbox" name="removePhoto" style="width:auto"> 移除原有照片</label>':''}<button class="primary">儲存紀錄</button><button type="button" class="small" onclick="go('health')">取消</button></form></div>`;document.getElementById('excretionForm').onsubmit=e=>{e.preventDefault();let d=new FormData(e.target),next={...x,id:id||uid(),cat:state.selected,type,dateTime:valueOf(d,'dateTime'),count:Number(d.get('count')),condition:valueOf(d,'condition'),color:valueOf(d,'color'),abnormal:valueOf(d,'abnormal'),notes:valueOf(d,'notes'),photo:d.get('removePhoto')?'':x.photo||''};let done=()=>{if(id)state.excretions[state.excretions.findIndex(y=>y.id===id)]=next;else state.excretions.push(next);storeSafely(()=>go('health'))};let file=document.getElementById('excretionPhoto');file.files.length?photoFile(file,p=>{next.photo=p;done()}):done()}}
function deleteExcretion(id){if(!confirm('確定刪除此筆排泄紀錄？'))return;state.excretions=state.excretions.filter(x=>x.id!==id);storeSafely(()=>go('health'))}
function healthPage(){let c=cat(),ws=state.weights.filter(x=>x.cat===state.selected).sort((a,b)=>b.date.localeCompare(a.date)),w=state.water.filter(x=>x.cat===state.selected).sort((a,b)=>b.date.localeCompare(a.date));return `<h2>健康紀錄</h2><div class="card"><div class="row"><h2>體重</h2><b>${c?.weight?fmt(c.weight)+' kg':'尚未記錄'}</b></div><button class="primary" onclick="formWeight()">＋ 新增體重紀錄</button>${ws.map(x=>`<div class="entry row"><span>${x.date}　${fmt(x.kg)} kg</span><span><button class="small" onclick="editWeight('${x.id}')">修改</button> <button class="delete" onclick="deleteWeight('${x.id}')">刪除</button></span></div>`).join('')}</div><div class="card"><h2>飲水紀錄</h2><button class="primary" onclick="formWater()">＋ 記錄額外飲水</button>${w.slice(0,15).map(x=>`<div class="entry">${x.date}　${fmt(x.ml)} mL</div>`).join('')}</div>${excretionPage()}`}
function supplementsPage(){let list=state.supplements;let logs=state.supplementLogs.filter(x=>x.cat===state.selected).sort((a,b)=>b.dateTime.localeCompare(a.dateTime));let d=today();let doneIds=new Set(logs.filter(x=>x.dateTime.slice(0,10)===d&&x.status==='done').map(x=>x.supplementId));return `<div class="card"><h2>保健品管理</h2><button class="primary" onclick="formSupplement()">＋ 新增保健品</button>${list.length?list.map(x=>`<div class="entry"><div class="row"><b>${esc(x.name)}</b><span><button class="small" onclick="formSupplement('${x.id}')">編輯</button> <button class="delete" onclick="deleteSupplement('${x.id}')">刪除</button></span></div><p class="muted">${esc(x.brand||'')} · ${esc(x.category||'')} · ${esc(x.dose||'未設定用量')} ${esc(x.unit||'')} ${x.daily?'· 每日固定':''}</p>${x.daily?`<button class="small" onclick="quickSupplement('${x.id}')">${doneIds.has(x.id)?'＋ 再記錄一次':'✓ 記錄今日已使用'}</button>`:''}</div>`).join(''):'<p class="empty">尚未建立保健品</p>'}</div><div class="card"><h2>使用紀錄</h2><button class="primary" onclick="formSupplementLog()">＋ 新增使用紀錄</button>${logs.length?logs.map(x=>{let sup=list.find(s=>s.id===x.supplementId);return `<div class="entry"><div class="row"><b>${esc(x.supplementName||sup?.name||'已刪除保健品')}</b><span><button class="small" onclick="formSupplementLog('${x.id}')">編輯</button> <button class="delete" onclick="deleteSupplementLog('${x.id}')">刪除</button></span></div><div class="muted">${esc(x.dateTime.replace('T',' '))} · ${fmt(x.amount)} ${esc(x.unit||'')} · ${x.status==='done'?'已使用':'未使用'}</div></div>`}).join(''):'<p class="empty">尚無使用紀錄</p>'}</div>`}
function formSupplement(id){let x=state.supplements.find(y=>y.id===id)||{};document.getElementById('content').innerHTML=`<div class="card"><h2>${id?'編輯':'新增'}保健品</h2><form id="suppForm">${inputField('品牌','brand',x.brand||'')}${inputField('保健品名稱','name',x.name||'','required')}<label>類型${choose('category',[['益生菌','益生菌'],['魚油','魚油'],['關節保健','關節保健'],['營養補充','營養補充'],['其他','其他']],x.category||'其他')}</label><label>劑型${choose('form',[['膠囊','膠囊'],['粉末','粉末'],['液體','液體'],['錠劑','錠劑'],['其他','其他']],x.form||'其他')}</label><label>使用單位${choose('unit',[['顆','顆'],['包','包'],['匙','匙'],['滴','滴'],['mL','mL'],['g','g']],x.unit||'顆')}</label>${numField('每次設定使用量（選填）','dose',x.dose)}<label><input type="checkbox" name="daily" style="width:auto" ${x.daily?'checked':''}> 每日固定使用</label><label>備註<textarea name="notes">${esc(x.notes||'')}</textarea></label><button class="primary">儲存保健品</button></form></div>`;document.getElementById('suppForm').onsubmit=e=>{e.preventDefault();let d=new FormData(e.target),next={...x,id:id||uid(),brand:valueOf(d,'brand'),name:valueOf(d,'name'),category:valueOf(d,'category'),form:valueOf(d,'form'),unit:valueOf(d,'unit'),dose:nOrNull(valueOf(d,'dose')),daily:d.has('daily'),notes:valueOf(d,'notes')};if(id)state.supplements[state.supplements.findIndex(y=>y.id===id)]=next;else state.supplements.push(next);storeSafely(()=>go('meals'))}}
function deleteSupplement(id){if(!confirm('確定刪除這項保健品？歷史使用紀錄會保留名稱。'))return;state.supplements=state.supplements.filter(x=>x.id!==id);storeSafely(()=>go('meals'))}

function formSupplementLog(id){if(!state.supplements.length){alert('請先新增保健品');return}let x=state.supplementLogs.find(y=>y.id===id)||{};document.getElementById('content').innerHTML=`<div class="card"><h2>${id?'編輯':'新增'}保健品使用紀錄</h2><form id="suppLogForm"><label>日期與時間<input name="dateTime" type="datetime-local" value="${esc(x.dateTime||dateTimeLocal())}" required></label><label>保健品${choose('supplementId',state.supplements.map(s=>[s.id,s.name]),x.supplementId||state.supplements[0].id)}</label>${numField('使用量','amount',x.amount??1,'required min="0"')}<label>狀態${choose('status',[['done','已使用'],['pending','未使用']],x.status||'done')}</label><button class="primary">儲存</button></form></div>`;document.getElementById('suppLogForm').onsubmit=e=>{e.preventDefault();let d=new FormData(e.target),sup=state.supplements.find(s=>s.id===d.get('supplementId'));let next={...x,id:id||uid(),cat:state.selected,supplementId:sup.id,supplementName:sup.name,dateTime:valueOf(d,'dateTime'),amount:Number(d.get('amount')),unit:sup.unit,status:valueOf(d,'status')};if(id)state.supplementLogs[state.supplementLogs.findIndex(y=>y.id===id)]=next;else state.supplementLogs.push(next);storeSafely(()=>go('meals'))}}
function deleteSupplementLog(id){if(!confirm('確定刪除這筆使用紀錄？'))return;state.supplementLogs=state.supplementLogs.filter(x=>x.id!==id);storeSafely(()=>go('meals'))}

// V4: daily care log. Existing records and the original localStorage key are preserved.
state.brushing ||= [];
window.careDate ||= today();
function careDate(){return window.careDate||today()}
function changeCareDate(v){window.careDate=v;go('meals')}
function carePage(){
 let d=careDate(),id=state.selected;
 let meals=state.meals.filter(x=>x.cat===id&&x.date===d);
 let waters=state.water.filter(x=>x.cat===id&&x.date===d);
 let logs=state.supplementLogs.filter(x=>x.cat===id&&x.dateTime.slice(0,10)===d);
 let brushing=state.brushing.find(x=>x.cat===id&&x.date===d);
 let mealWater=meals.reduce((s,x)=>s+Number(x.water||0),0);
 let drinkWater=waters.reduce((s,x)=>s+Number(x.ml||0),0);
 let fixed=state.supplements.filter(x=>x.daily);
 let fixedHtml=fixed.length?fixed.map(x=>{
  let entries=logs.filter(y=>y.supplementId===x.id&&y.status==='done');
  return `<div class="entry row"><div><b>${esc(x.name)}</b><br><span class="muted">${x.dose??'—'} ${esc(x.unit||'')}</span></div><label style="display:flex;align-items:center;gap:7px"><input style="width:auto" type="checkbox" ${entries.length?'checked':''} onchange="toggleDailySupplement('${x.id}',this.checked)">已使用</label></div>`;
 }).join(''):'<p class="muted">尚未設定每日固定保健品，可至「食品庫 → 保健品管理」新增。</p>';
 return `<h2>照顧紀錄</h2><div class="card"><label>紀錄日期<input type="date" value="${esc(d)}" onchange="changeCareDate(this.value)"></label></div>
 <div class="card"><div class="row"><h2>① 飲食紀錄</h2><button class="small" onclick="formMealForCare()">＋ 新增餐次</button></div>${meals.length?meals.map(x=>`<div class="entry row"><div><b>${esc(x.food)}</b><br><span class="muted">${fmt(x.grams)} g · ${fmt(x.kcal)} kcal</span></div><button class="delete" onclick="remove('meals','${x.id}')">刪除</button></div>`).join(''):'<p class="muted">這天尚無飲食紀錄</p>'}</div>
 <div class="card"><div class="row"><h2>② 飲水紀錄</h2><button class="small" onclick="formWaterForCare()">＋ 記錄飲水</button></div><p>額外飲水：<b>${fmt(drinkWater)} mL</b><br>食物水分：<b>${fmt(mealWater)} mL</b><br>總水分：<b>${fmt(drinkWater+mealWater)} mL</b></p>${waters.map(x=>`<div class="entry row"><span>${fmt(x.ml)} mL</span><span><button class="small" onclick="editCareWater('${x.id}')">修改</button> <button class="delete" onclick="removeCareWater('${x.id}')">刪除</button></span></div>`).join('')}</div>
 <div class="card"><div class="row"><h2>③ 保健品紀錄</h2><button class="small" onclick="formSupplementLogForCare()">＋ 使用紀錄</button></div>${fixedHtml}${logs.length?logs.map(x=>`<div class="entry row"><div><b>${esc(x.supplementName||'保健品')}</b><br><span class="muted">${fmt(x.amount)} ${esc(x.unit||'')} · ${esc(x.dateTime.slice(11)||'')} · ${x.status==='done'?'已使用':'未使用'}</span></div><span><button class="small" onclick="formSupplementLog('${x.id}')">編輯</button> <button class="delete" onclick="deleteSupplementLog('${x.id}')">刪除</button></span></div>`).join(''):'<p class="muted">這天尚無使用紀錄</p>'}</div>
 <div class="card"><h2>④ 每日刷牙</h2><label style="display:flex;align-items:center;gap:10px"><input type="checkbox" style="width:auto" id="brushCheck" ${brushing?.done?'checked':''} onchange="saveBrushing()"> 今日已刷牙</label><p class="muted" id="brushTime">${brushing?.done&&brushing?.completedAt?'完成時間：'+esc(brushing.completedAt.replace('T',' ')):'尚未完成'}</p><label>備註（選填）<textarea id="brushNotes" placeholder="例如：今天不太配合、牙齦出血" onblur="saveBrushing()">${esc(brushing?.notes||'')}</textarea></label><button class="small" onclick="saveBrushing()">儲存備註</button></div>`
}
function saveBrushing(){let id=state.selected,d=careDate(),check=document.getElementById('brushCheck');if(!check)return;let notes=document.getElementById('brushNotes').value,done=check.checked;let item=state.brushing.find(x=>x.cat===id&&x.date===d);if(!item){item={id:uid(),cat:id,date:d,done:false,completedAt:'',notes:''};state.brushing.push(item)}if(done&&!item.done)item.completedAt=new Date().toISOString();if(!done)item.completedAt='';item.done=done;item.notes=notes;storeSafely(()=>{document.getElementById('brushTime').textContent=done?'已完成（時間已記錄）':'尚未完成'})}

function formSupplementLogForCare(){formSupplementLog();let el=document.querySelector('#suppLogForm [name="dateTime"]');if(el)el.value=careDate()+'T'+new Date().toTimeString().slice(0,5)}
const oldFoodsPage=foodsPage;
foodsPage=function(){return oldFoodsPage()+`<div class="card"><div class="row"><h2>保健品資料庫</h2><button class="small" onclick="formSupplement()">＋ 新增</button></div>${state.supplements.length?state.supplements.map(x=>`<div class="entry row"><div><b>${esc(x.name)}</b><br><span class="muted">${esc(x.brand||'')} · ${x.daily?'每日固定':'非固定'} · ${x.dose??'—'} ${esc(x.unit||'')}</span></div><span><button class="small" onclick="formSupplement('${x.id}')">編輯</button> <button class="delete" onclick="deleteSupplement('${x.id}')">刪除</button></span></div>`).join(''):'<p class="muted">尚未新增保健品</p>'}</div>`};
mealsPage=carePage;
// Route new water and supplement records back to the care tab.
const oldFormWater=formWater;
formWater=function(){oldFormWater();let form=document.getElementById('waterForm');if(!form)return;form.onsubmit=e=>{e.preventDefault();let f=new FormData(form);state.water.push({id:uid(),cat:state.selected,date:f.get('date'),ml:Number(f.get('ml'))});storeSafely(()=>go('meals'))}};
const oldFormSupplementLog=formSupplementLog;
formSupplementLog=function(id){oldFormSupplementLog(id);let form=document.getElementById('suppLogForm');if(!form)return;form.onsubmit=e=>{e.preventDefault();let d=new FormData(form),sup=state.supplements.find(s=>s.id===d.get('supplementId'));if(!sup)return;let x=state.supplementLogs.find(y=>y.id===id)||{};let next={...x,id:id||uid(),cat:state.selected,supplementId:sup.id,supplementName:sup.name,dateTime:valueOf(d,'dateTime'),amount:Number(d.get('amount')),unit:sup.unit,status:valueOf(d,'status')};if(id)state.supplementLogs[state.supplementLogs.findIndex(y=>y.id===id)]=next;else state.supplementLogs.push(next);storeSafely(()=>go('meals'))}};
const oldTodayPage=todayPage;
todayPage=function(){let d=today(),id=state.selected;let m=state.meals.filter(x=>x.cat===id&&x.date===d),w=state.water.filter(x=>x.cat===id&&x.date===d),l=state.supplementLogs.filter(x=>x.cat===id&&x.dateTime.slice(0,10)===d&&x.status==='done'),b=state.brushing.find(x=>x.cat===id&&x.date===d),u=state.excretions.filter(x=>x.cat===id&&x.dateTime.slice(0,10)===d);let summary=`<div class="card"><div class="row"><h2>今日照顧進度</h2><button class="small" onclick="window.careDate=today();go('meals')">前往照顧紀錄</button></div><div class="entry">飲食：${m.length} 餐</div><div class="entry">額外飲水：${fmt(w.reduce((s,x)=>s+Number(x.ml||0),0))} mL</div><div class="entry">保健品：${l.length} 筆已使用</div><div class="entry">刷牙：${b?.done?'✓ 已完成':'尚未記錄完成'}</div><div class="entry">尿尿：${u.filter(x=>x.type==='urine').reduce((s,x)=>s+Number(x.count||0),0)} 次／大便：${u.filter(x=>x.type==='stool').reduce((s,x)=>s+Number(x.count||0),0)} 次</div></div>`;return oldTodayPage()+summary};
const oldDeleteCatV4=deleteCat;
deleteCat=function(id){let brushingIds=state.brushing.filter(x=>x.cat===id).map(x=>x.id);oldDeleteCatV4(id);if(!state.cats.some(x=>x.id===id)){state.brushing=state.brushing.filter(x=>!brushingIds.includes(x.id));storeSafely(()=>render())}};

render();
</script></body></html>
