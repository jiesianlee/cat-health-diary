<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>貓咪健康日記</title><style>:root{--blue:#86a9c1;--ink:#39454b;--cream:#f8f5ee;--soft:#eef2f2}*{box-sizing:border-box}body{margin:0;background:#e9e8e3;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif}.app{max-width:480px;min-height:100dvh;margin:auto;background:var(--cream);padding:22px 18px 100px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:23px;letter-spacing:2px;margin:8px 0 20px}h2{font-size:19px;margin:6px 0 14px}.muted{color:#879096;font-size:13px}.cats{display:flex;gap:14px;overflow-x:auto;padding:4px 0 18px}.cat{min-width:70px;text-align:center;border:0;background:none;color:inherit}.cat img{width:66px;height:66px;border-radius:50%;object-fit:cover;border:3px solid transparent}.cat.active img{border-color:#76a7c9}.cat span{display:block;margin-top:4px}.plus{width:66px;height:66px;border-radius:50%;background:#e6edf1;display:grid;place-items:center;font-size:30px;color:#6f9ab6}.hero{display:flex;gap:15px;align-items:center;margin-bottom:15px}.hero img{width:46%;aspect-ratio:1/1.2;object-fit:cover;border-radius:20px}.hero strong{font-size:26px}.card{background:white;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 4px 16px #65727c10}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{background:#f3f6f7;border-radius:15px;padding:14px;text-align:center}.stat b{font-size:23px}.bar{height:10px;background:#e6ebed;border-radius:20px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:#9fc0d9;width:0}.bar.peach i{background:#e8bb93}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);background:#fffdf9;display:flex;justify-content:space-around;padding:10px 4px max(12px,env(safe-area-inset-bottom));box-shadow:0 -3px 18px #0000000b}.nav button{border:0;background:transparent;color:#7f8588;font-size:12px;padding:8px 10px;border-radius:12px}.nav button.on{background:#e6eff4;color:#477fa5}.nav em{display:block;font-size:22px;font-style:normal}button.primary{border:0;border-radius:30px;background:var(--blue);color:white;padding:13px 20px;font-size:15px;width:100%;margin-top:12px}button.small{border:0;border-radius:15px;background:#e8eff3;padding:9px 12px;color:#497a9c}input,select,textarea{width:100%;padding:12px;border:1px solid #d9dfe0;border-radius:12px;background:white;font-size:16px;margin:5px 0 13px}label{font-size:14px;display:block}.entry{border-bottom:1px solid #edf0f1;padding:12px 0}.entry:last-child{border:0}.hidden{display:none}.notice{font-size:12px;color:#8c9397;line-height:1.7}.pill{display:inline-block;padding:5px 10px;background:#e9f0f3;border-radius:15px;font-size:12px}.empty{padding:22px;text-align:center;color:#8b969b}.section-title{font-size:14px;color:#879096;margin:20px 0 8px}.delete{border:0;background:none;color:#ad7e7e;font-size:12px}
.auth-box{max-width:420px;margin:55px auto}.error{color:#a43b3b;font-size:13px;white-space:pre-wrap}.ok{color:#28755a}.nav button{padding:8px 5px;flex:1}.nav em{font-size:20px}.loading{text-align:center;padding:35px}.photo{max-width:100%;max-height:200px;border-radius:12px}.chip{display:inline-block;background:#e9f0f3;border-radius:10px;padding:4px 8px}.row{flex-wrap:wrap}.entry button{margin:2px}textarea{min-height:75px}button:disabled{opacity:.5}#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);max-width:440px;width:90%;background:#39454b;color:white;padding:13px;border-radius:12px;display:none;z-index:1000}#auth{max-width:480px;margin:auto;background:var(--cream);min-height:100dvh;padding:25px}.small-outline{background:white;border:1px solid #cddbe2;color:#477fa5;border-radius:14px;padding:8px 10px}
</style></head><body><div id="toast"></div><div id="auth" style="display:none"></div><main class="app" id="app" style="display:none"><header><h1>貓咪健康日記 🐾</h1><div><button class="small" onclick="manageCats()">多貓管理 ⚙</button> <button class="small" onclick="logout()">登出</button></div></header><div class="cats" id="cats"></div><section id="content"></section></main><nav class="nav" id="nav"></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>

const SUPABASE_PROJECT_URL='https://plwjjqjubpiecenuduvg.supabase.co';
const KEY='sb_publishable_JKRospE3mimBySPLUMlW9Q_RRsiM_Py';
const db=window.supabase.createClient(SUPABASE_PROJECT_URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let user=null, data={}, selected=null, tab='today', careDate=localDate(), loading=false, signed={};
const names={cats:'cats',foods:'foods',meals:'meals',water:'water_records',supplements:'supplements',schedules:'supplement_schedules',logs:'supplement_logs',dental:'dental_records',eliminations:'elimination_records',health:'health_records'};
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=x=>x==null?'—':Number(x).toFixed(1).replace(/\.0$/,'');
function localDate(d=new Date()){let y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
const atDate=(date,time='12:00')=>new Date(`${date}T${time}:00`).toISOString();
const datePart=x=>x?localDate(new Date(x)):'';
const timePart=x=>x?new Date(x).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',hour12:false}):'';
const cat=()=>data.cats?.find(x=>x.id===selected);
const mine=(table)=>data[table]||[];
const forCat=(table)=>mine(table).filter(x=>x.cat_id===selected);
const today=()=>localDate();
const num=(v)=>v===''||v==null?null:Number(v);
function toast(msg,bad=false){let e=$('toast');e.textContent=msg;e.style.background=bad?'#9d5555':'#39454b';e.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>e.style.display='none',4200)}
function busy(on){loading=on;document.querySelectorAll('button.primary').forEach(b=>b.disabled=on)}
async function run(promise){const {data:result,error}=await promise;if(error)throw new Error(error.message);return result}
async function change(table,action,payload,id){busy(true);try{if(action==='insert')await run(db.from(names[table]).insert(payload));else if(action==='update')await run(db.from(names[table]).update(payload).eq('id',id));else if(action==='delete')await run(db.from(names[table]).delete().eq('id',id));await refresh();toast('已儲存至雲端');return true}catch(e){toast('操作失敗：'+e.message,true);return false}finally{busy(false)}}
async function refresh(){if(!user)return;try{let pairs=await Promise.all(Object.entries(names).map(async([k,v])=>[k,await run(db.from(v).select('*').order('created_at',{ascending:false}).limit(1500))]));data=Object.fromEntries(pairs);if(!mine('cats').some(c=>c.id===selected))selected=mine('cats')[0]?.id||null;await signPhotos();render()}catch(e){toast('讀取雲端資料失敗：'+e.message,true);render()}}
async function signPhotos(){signed={};let paths=[...mine('cats').map(x=>x.photo_url),...mine('eliminations').map(x=>x.photo_url)].filter(Boolean);await Promise.all(paths.map(async p=>{let {data:d}=await db.storage.from('cat-photos').createSignedUrl(p,3600);if(d?.signedUrl)signed[p]=d.signedUrl}))}
function photo(path){return signed[path]||''}
function formHTML(title,body,submit='儲存'){return `<div class="card"><h2>${title}</h2><form id="editForm">${body}<button class="primary" type="submit">${submit}</button><button type="button" class="small" onclick="render()">取消</button></form></div>`}
function input(label,name,value='',type='text',more=''){return `<label>${label}<input name="${name}" type="${type}" value="${esc(value??'')}" ${more}></label>`}
function area(label,name,value=''){return `<label>${label}<textarea name="${name}">${esc(value||'')}</textarea></label>`}
function select(label,name,opts,val){return `<label>${label}<select name="${name}">${opts.map(([v,t])=>`<option value="${esc(v)}" ${String(v)===String(val)?'selected':''}>${esc(t)}</option>`).join('')}</select></label>`}
function formData(){return Object.fromEntries(new FormData($('editForm')).entries())}
function setForm(fn){$('editForm').onsubmit=async e=>{e.preventDefault();await fn(formData())}}
function photoInput(){return '<label>照片（選填）<input name="image" type="file" accept="image/jpeg,image/png,image/webp"></label>'}
async function uploadImage(file,folder){if(!file||!file.size)return null;if(file.size>5*1024*1024)throw Error('照片不得超過 5 MB');let im=await createImageBitmap(file);let scale=Math.min(1,1000/Math.max(im.width,im.height));let cv=document.createElement('canvas');cv.width=Math.round(im.width*scale);cv.height=Math.round(im.height*scale);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);let blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',.75));let path=`${user.id}/${folder}/${crypto.randomUUID()}.jpg`;await run(db.storage.from('cat-photos').upload(path,blob,{contentType:'image/jpeg'}));return path}
function authPage(){ $('app').style.display='none';$('nav').style.display='none';$('auth').style.display='block';$('auth').innerHTML=`<div class="auth-box"><h1>貓咪健康日記 🐾</h1><div class="card"><h2>雲端登入</h2><p class="muted">登入後，手機與電腦可同步紀錄。</p><form id="authForm">${input('電子郵件','email','','email','required autocomplete="email"')}${input('密碼（至少 6 個字元）','password','','password','required minlength="6" autocomplete="current-password"')}<button class="primary" name="action" value="login">登入</button><button class="primary" type="button" id="signup" style="background:#a8b9ac">建立新帳號</button><p id="authMsg" class="notice"></p></form></div></div>`;let f=$('authForm');async function submit(signup){let d=new FormData(f),email=String(d.get('email')),password=String(d.get('password'));let {data:res,error}=signup?await db.auth.signUp({email,password}):await db.auth.signInWithPassword({email,password});if(error){$('authMsg').textContent=error.message;return}if(signup&&!res.session){$('authMsg').textContent='註冊成功！請先到電子郵件信箱點選驗證連結，再回來登入。';return}if(res.session)await signedIn(res.session.user)}f.onsubmit=e=>{e.preventDefault();submit(false)};$('signup').onclick=()=>submit(true)}
async function signedIn(u){user=u;$('auth').style.display='none';$('app').style.display='block';$('nav').style.display='flex';await refresh()}
async function logout(){await db.auth.signOut();user=null;data={};selected=null;authPage()}
function render(){if(!user)return;let tabs=[['today','⌂','今日'],['care','▤','照顧紀錄'],['foods','▣','食品庫'],['health','♡','健康'],['medical','♧','醫療'],['stats','▥','統計']];$('nav').innerHTML=tabs.map(([id,icon,label])=>`<button class="${tab===id?'on':''}" onclick="go('${id}')"><em>${icon}</em>${label}</button>`).join('');$('cats').innerHTML=mine('cats').map(c=>`<button class="cat ${selected===c.id?'active':''}" onclick="selectCat('${c.id}')">${photo(c.photo_url)?`<img src="${esc(photo(c.photo_url))}">`:`<span class="plus">🐱</span>`}<span>${esc(c.name)}</span></button>`).join('')+`<button class="cat" onclick="editCat()"><span class="plus">＋</span><span>新增貓咪</span></button>`;$('content').innerHTML=({today:todayPage,care:carePage,foods:foodsPage,health:healthPage,medical:medicalPage,stats:statsPage}[tab])()}
function go(t){tab=t;render()}
function selectCat(id){selected=id;render()}
function manageCats(){$('content').innerHTML=`<h2>多貓管理</h2>${mine('cats').map(c=>`<div class="card row"><b>${esc(c.name)}</b><span><button class="small" onclick="editCat('${c.id}')">編輯</button> <button class="delete" onclick="del('cats','${c.id}')">刪除</button></span></div>`).join('')}<button class="primary" onclick="editCat()">＋ 新增貓咪</button><button class="small" onclick="render()">返回</button>`}
async function del(table,id){if(!confirm('確定刪除此筆資料？刪除後無法復原。'))return;await change(table,'delete',null,id)}
function editCat(id){let x=mine('cats').find(c=>c.id===id)||{};$('content').innerHTML=formHTML(id?'編輯貓咪':'新增貓咪',input('名字','name',x.name,'text','required')+input('年齡（文字）','age',x.age)+input('目前體重 kg','weight',x.weight,'number','step="0.01" min="0"')+photoInput());setForm(async d=>{try{let photo_url=x.photo_url||null;let file=$('editForm').elements.image.files[0];if(file)photo_url=await uploadImage(file,'cats');await change('cats',id?'update':'insert',{name:d.name,age:d.age,weight:num(d.weight),photo_url},id)}catch(e){toast(e.message,true)}})}
function todayData(date=today()){let meals=forCat('meals').filter(x=>datePart(x.eaten_at)===date),water=forCat('water').filter(x=>datePart(x.recorded_at)===date),logs=forCat('logs').filter(x=>datePart(x.used_at)===date),dental=forCat('dental').find(x=>x.record_date===date),elim=forCat('eliminations').filter(x=>datePart(x.recorded_at)===date);return {meals,water,logs,dental,elim,kcal:meals.reduce((s,x)=>s+Number(x.kcal||0),0),foodWater:meals.reduce((s,x)=>s+Number(x.water_ml||0),0),drink:water.reduce((s,x)=>s+Number(x.amount_ml||0),0)}}
function todayPage(){let c=cat();if(!c)return '<div class="card empty">請先新增貓咪，開始記錄健康日記。<br><button class="primary" onclick="editCat()">新增貓咪</button></div>';let d=todayData();return `<div class="hero">${photo(c.photo_url)?`<img src="${esc(photo(c.photo_url))}">`:''}<div><strong>${esc(c.name)}</strong><p class="muted">${esc(c.age||'')}<br>${c.weight_kg||c.weight?fmt(c.weight_kg||c.weight)+' kg':'尚未設定體重'}</p><span class="pill">今天也要好好吃飯</span></div></div><div class="card"><div class="row"><h2>今日攝取摘要</h2><span class="muted">${today()}</span></div><div class="stats"><div class="stat">熱量<br><b>${fmt(d.kcal)}</b><br>kcal</div><div class="stat">水分<br><b>${fmt(d.foodWater+d.drink)}</b><br>mL</div></div><p class="notice">水分包含食物含水量與額外飲水；不是醫療建議攝取量。</p></div><div class="card"><h2>今日照顧進度</h2><div class="entry">飲食：${d.meals.length} 餐</div><div class="entry">額外飲水：${fmt(d.drink)} mL</div><div class="entry">保健品：${d.logs.length} 筆已使用</div><div class="entry">刷牙：${d.dental?.completed?'✓ 已完成':'尚未完成'}</div><div class="entry">尿尿：${d.elim.filter(x=>x.type==='urine').length} 筆／大便：${d.elim.filter(x=>x.type==='stool').length} 筆</div><button class="primary" onclick="careDate=today();go('care')">前往照顧紀錄</button></div>`}
function carePage(){if(!cat())return '<div class="empty">請先新增貓咪</div>';let d=todayData(careDate),fixed=mine('schedules').filter(x=>x.cat_id===selected&&x.is_active);return `<h2>照顧紀錄</h2><div class="card">${input('紀錄日期','careDate',careDate,'date','onchange="setCareDate(this.value)"')}</div><div class="card"><div class="row"><h2>① 飲食紀錄</h2><button class="small" onclick="editMeal()">＋ 新增</button></div>${d.meals.map(x=>`<div class="entry row"><span>${esc(mine('foods').find(f=>f.id===x.food_id)?.name||'已刪除食品')}<br><small>${fmt(x.grams)} g · ${fmt(x.kcal)} kcal</small></span><button class="delete" onclick="del('meals','${x.id}')">刪除</button></div>`).join('')||'<p class="muted">尚無紀錄</p>'}</div><div class="card"><div class="row"><h2>② 飲水紀錄</h2><button class="small" onclick="editWater()">＋ 新增</button></div><p>額外飲水 ${fmt(d.drink)} mL｜食物水分 ${fmt(d.foodWater)} mL<br><b>合計 ${fmt(d.drink+d.foodWater)} mL</b></p>${d.water.map(x=>`<div class="entry row"><span>${fmt(x.amount_ml)} mL</span><span><button class="small" onclick="editWater('${x.id}')">編輯</button><button class="delete" onclick="del('water','${x.id}')">刪除</button></span></div>`).join('')}</div><div class="card"><div class="row"><h2>③ 保健品紀錄</h2><button class="small" onclick="editLog()">＋ 臨時紀錄</button></div>${fixed.length?fixed.map(x=>{let s=mine('supplements').find(s=>s.id===x.supplement_id),logs=d.logs.filter(l=>l.schedule_id===x.id);return `<div class="entry row"><div><b>${esc(s?.name||'保健品')}</b><br><span class="muted">${esc(x.dose||s?.default_dose||'')}</span></div><label style="display:flex;align-items:center;gap:8px"><input type="checkbox" style="width:auto" ${logs.length?'checked':''} onchange="toggleSupplement('${x.id}',this.checked)">已使用</label></div>`}).join(''):'<p class="muted">尚未設定固定保健品，請至食品庫新增並設定。</p>'}${d.logs.map(x=>`<div class="entry row"><span>${esc(mine('supplements').find(s=>s.id===x.supplement_id)?.name||'保健品')}<br><small>${esc(x.dose||'')} · ${timePart(x.used_at)}</small></span><button class="delete" onclick="del('logs','${x.id}')">刪除</button></div>`).join('')}</div><div class="card"><h2>④ 每日刷牙</h2><label style="display:flex;gap:10px;align-items:center"><input id="brushCheck" type="checkbox" style="width:auto" ${d.dental?.completed?'checked':''} onchange="saveDental()">今日已刷牙</label><p class="muted">${d.dental?.completed_at?'完成時間：'+timePart(d.dental.completed_at):'尚未完成'}</p><label>備註（選填）<textarea id="brushNotes" onblur="saveDental()">${esc(d.dental?.notes||'')}</textarea></label><button class="small" onclick="saveDental()">儲存備註</button></div>`}
function setCareDate(d){careDate=d;render()}
async function saveDental(){let x=forCat('dental').find(x=>x.record_date===careDate),done=$('brushCheck').checked,notes=$('brushNotes').value;let payload={cat_id:selected,record_date:careDate,completed:done,completed_at:done?(x?.completed_at||new Date().toISOString()):null,notes};await change('dental',x?'update':'insert',payload,x?.id)}
async function toggleSupplement(id,checked){let schedule=mine('schedules').find(x=>x.id===id);if(!schedule)return;let old=forCat('logs').filter(x=>x.schedule_id===id&&datePart(x.used_at)===careDate);if(checked&&!old.length)await change('logs','insert',{cat_id:selected,supplement_id:schedule.supplement_id,schedule_id:id,dose:schedule.dose||mine('supplements').find(s=>s.id===schedule.supplement_id)?.default_dose||'',used_at:atDate(careDate,new Date().toTimeString().slice(0,5))});else if(!checked){busy(true);try{for(let x of old)await run(db.from('supplement_logs').delete().eq('id',x.id));await refresh()}catch(e){toast(e.message,true)}finally{busy(false)}}}
function editMeal(){if(!mine('foods').length){toast('請先到食品庫新增食品',true);go('foods');return}$('content').innerHTML=formHTML('新增飲食紀錄',input('日期','date',careDate,'date','required')+select('食品','food_id',mine('foods').map(f=>[f.id,f.name]))+input('實際吃下重量（g）','grams','','number','required min="0.1" step="0.1"'));setForm(async d=>{let f=mine('foods').find(x=>x.id===d.food_id),g=Number(d.grams);await change('meals','insert',{cat_id:selected,food_id:f.id,eaten_at:atDate(d.date),grams:g,kcal:f.kcal_per_100g==null?null:g*Number(f.kcal_per_100g)/100,water_ml:f.moisture_percent==null?null:g*Number(f.moisture_percent)/100,phosphorus_mg:f.phosphorus_mg_per_100g==null?null:g*Number(f.phosphorus_mg_per_100g)/100,sodium_mg:f.sodium_mg_per_100g==null?null:g*Number(f.sodium_mg_per_100g)/100,protein_g:f.protein_percent==null?null:g*Number(f.protein_percent)/100})})}
function editWater(id){let x=mine('water').find(x=>x.id===id)||{};$('content').innerHTML=formHTML(id?'編輯飲水':'新增飲水',input('日期','date',x.recorded_at?datePart(x.recorded_at):careDate,'date','required')+input('飲水量 mL','ml',x.amount_ml,'number','min="0.1" step="0.1" required'));setForm(async d=>change('water',id?'update':'insert',{cat_id:selected,recorded_at:atDate(d.date),amount_ml:Number(d.ml)},id))}
function foodsPage(){return `<h2>食品庫</h2><div class="card"><div class="row"><h2>食物資料庫</h2><button class="small" onclick="editFood()">＋ 新增</button></div>${mine('foods').map(x=>`<div class="entry"><div class="row"><b>${esc(x.name)}</b><span><button class="small" onclick="editFood('${x.id}')">編輯</button><button class="delete" onclick="del('foods','${x.id}')">刪除</button></span></div><span class="muted">${esc(x.category)} · ${fmt(x.kcal_per_100g)} kcal/100g · 磷 ${fmt(x.phosphorus_mg_per_100g)} mg/100g · 鈉 ${fmt(x.sodium_mg_per_100g)} mg/100g</span></div>`).join('')||'<p class="muted">尚無食品</p>'}</div><div class="card"><div class="row"><h2>保健品資料庫</h2><button class="small" onclick="editSupplement()">＋ 新增</button></div>${mine('supplements').map(s=>`<div class="entry"><div class="row"><b>${esc(s.name)}</b><span><button class="small" onclick="editSupplement('${s.id}')">編輯</button><button class="delete" onclick="del('supplements','${s.id}')">刪除</button></span></div><p class="muted">${esc(s.default_dose||'未設定用量')}</p><button class="small" onclick="editSchedule('${s.id}')">＋ 設定為目前貓咪的固定保健品</button></div>`).join('')||'<p class="muted">尚無保健品</p>'}</div><div class="card"><h2>目前貓咪的固定保健品</h2>${mine('schedules').filter(s=>s.cat_id===selected&&s.is_active).map(s=>`<div class="entry row"><span>${esc(mine('supplements').find(x=>x.id===s.supplement_id)?.name||'保健品')} · ${esc(s.dose||'')}</span><button class="delete" onclick="disableSchedule('${s.id}')">停用</button></div>`).join('')||'<p class="muted">尚未設定</p>'}</div>`}
function normalizeMineral(value,unit,kcal){if(value===''||value==null)return null;let v=Number(value);return unit==='percent'?v*1000:unit==='per100kcal'?(Number(kcal)>0?v*Number(kcal)/100:null):v}
function editFood(id){let x=mine('foods').find(f=>f.id===id)||{};let opts=[['wet','濕食'],['dry','乾飼料'],['treat','點心'],['other','其他']];let units=[['per100g','mg / 100g'],['per100kcal','mg / 100kcal'],['percent','%']];$('content').innerHTML=formHTML(id?'編輯食品':'新增食品',input('食品名稱','name',x.name,'text','required')+select('分類','category',opts,x.category||'wet')+input('熱量 kcal / 100g','kcal',x.kcal_per_100g,'number','step="any" min="0" required')+input('含水率 %','moisture',x.moisture_percent,'number','step="any" min="0" max="100"')+input('蛋白質 %','protein',x.protein_percent,'number','step="any" min="0" max="100"')+input('磷含量','phos',x.phosphorus_mg_per_100g,'number','step="any" min="0"')+select('磷單位','phosUnit',units,'per100g')+input('鈉含量','sodium',x.sodium_mg_per_100g,'number','step="any" min="0"')+select('鈉單位','sodiumUnit',units,'per100g')+'<p class="notice">編輯時顯示的是換算後的 mg/100g。缺少營養數據請留空，不要填 0。</p>');setForm(async d=>{let ph=normalizeMineral(d.phos,d.phosUnit,d.kcal),so=normalizeMineral(d.sodium,d.sodiumUnit,d.kcal);if((d.phos&&ph===null)||(d.sodium&&so===null)){toast('熱量須大於 0 才能換算 mg/100kcal',true);return}await change('foods',id?'update':'insert',{name:d.name,category:d.category,kcal_per_100g:num(d.kcal),moisture_percent:num(d.moisture),protein_percent:num(d.protein),phosphorus_mg_per_100g:ph,sodium_mg_per_100g:so},id)})}
function editSupplement(id){let x=mine('supplements').find(s=>s.id===id)||{};$('content').innerHTML=formHTML(id?'編輯保健品':'新增保健品',input('名稱','name',x.name,'text','required')+input('預設使用量（例如 1 包）','dose',x.default_dose)+area('備註','notes',x.notes));setForm(async d=>change('supplements',id?'update':'insert',{name:d.name,default_dose:d.dose,notes:d.notes},id))}
function editSchedule(sid){if(!cat()){toast('請先新增貓咪',true);return}let s=mine('supplements').find(x=>x.id===sid);$('content').innerHTML=formHTML('設定每日固定保健品',`<p>${esc(s.name)}</p>`+input('每日用量（文字）','dose',s.default_dose));setForm(async d=>{let existing=mine('schedules').find(x=>x.cat_id===selected&&x.supplement_id===sid);await change('schedules',existing?'update':'insert',{cat_id:selected,supplement_id:sid,dose:d.dose,is_active:true},existing?.id)})}
async function disableSchedule(id){await change('schedules','update',{is_active:false},id)}
function editLog(){if(!mine('supplements').length){toast('請先在食品庫新增保健品',true);go('foods');return}$('content').innerHTML=formHTML('新增保健品使用紀錄',input('日期','date',careDate,'date','required')+select('保健品','supplement_id',mine('supplements').map(x=>[x.id,x.name]))+input('使用量（例如 1 包）','dose',''));setForm(async d=>change('logs','insert',{cat_id:selected,supplement_id:d.supplement_id,used_at:atDate(d.date),dose:d.dose}))}
function healthPage(){if(!cat())return '<div class="empty">請先新增貓咪</div>';let weights=forCat('health').filter(x=>x.type==='weight'),elim=forCat('eliminations');return `<h2>健康紀錄</h2><div class="card"><div class="row"><h2>體重</h2><button class="small" onclick="editWeight()">＋ 新增</button></div>${weights.map(x=>`<div class="entry row"><span>${datePart(x.recorded_at)}　${fmt(x.weight_kg)} kg</span><span><button class="small" onclick="editWeight('${x.id}')">編輯</button><button class="delete" onclick="del('health','${x.id}')">刪除</button></span></div>`).join('')||'<p class="muted">尚無體重紀錄</p>'}</div><div class="card"><h2>排泄紀錄</h2><button class="small" onclick="editElimination('urine')">＋ 尿尿</button> <button class="small" onclick="editElimination('stool')">＋ 大便</button>${elim.map(x=>`<div class="entry"><div class="row"><b>${x.type==='urine'?'尿尿':'大便'} · ${datePart(x.recorded_at)}</b><span><button class="small" onclick="editElimination('${x.type}','${x.id}')">編輯</button><button class="delete" onclick="del('eliminations','${x.id}')">刪除</button></span></div><p class="muted">${esc(x.status||'')} ${esc(x.quantity||'')} ${esc(x.notes||'')}</p>${photo(x.photo_url)?`<img class="photo" src="${esc(photo(x.photo_url))}">`:''}</div>`).join('')||'<p class="muted">尚無紀錄</p>'}</div>`}
function editWeight(id){let x=mine('health').find(x=>x.id===id)||{};$('content').innerHTML=formHTML(id?'編輯體重':'新增體重',input('日期','date',x.recorded_at?datePart(x.recorded_at):today(),'date','required')+input('體重 kg','kg',x.weight_kg,'number','required min="0.01" step="0.01"'));setForm(async d=>{let ok=await change('health',id?'update':'insert',{cat_id:selected,type:'weight',recorded_at:atDate(d.date),weight_kg:Number(d.kg)},id);if(ok){let c=cat();await change('cats','update',{weight:Number(d.kg)},c.id)}})}
function editElimination(type,id){let x=mine('eliminations').find(x=>x.id===id)||{};$('content').innerHTML=formHTML(id?'編輯排泄':'新增排泄',input('日期','date',x.recorded_at?datePart(x.recorded_at):today(),'date','required')+input('時間','time',x.recorded_at?timePart(x.recorded_at):'12:00','time','required')+input('狀態','status',x.status)+input('次數／量（文字）','quantity',x.quantity)+area('備註、異常','notes',x.notes)+photoInput());setForm(async d=>{try{let p=x.photo_url||null;let f=$('editForm').elements.image.files[0];if(f)p=await uploadImage(f,'eliminations');await change('eliminations',id?'update':'insert',{cat_id:selected,type,recorded_at:atDate(d.date,d.time),status:d.status,quantity:d.quantity,notes:d.notes,photo_url:p},id)}catch(e){toast(e.message,true)}})}
function medicalPage(){let list=forCat('health').filter(x=>x.type!=='weight');return `<h2>醫療紀錄</h2><div class="card"><button class="primary" onclick="editMedical()">＋ 新增醫療紀錄</button>${list.map(x=>`<div class="entry"><div class="row"><b>${esc(x.title||x.type)}</b><span><button class="small" onclick="editMedical('${x.id}')">編輯</button><button class="delete" onclick="del('health','${x.id}')">刪除</button></span></div><p class="muted">${datePart(x.recorded_at)} · ${esc(x.value||'')}</p><p>${esc(x.notes||'')}</p></div>`).join('')||'<p class="muted">尚無紀錄</p>'}</div>`}
function editMedical(id){let x=mine('health').find(x=>x.id===id)||{};$('content').innerHTML=formHTML(id?'編輯醫療紀錄':'新增醫療紀錄',input('日期','date',x.recorded_at?datePart(x.recorded_at):today(),'date','required')+select('類型','type',[['visit','回診'],['lab','檢驗'],['symptom','症狀'],['medication','用藥'],['other','其他']],x.type||'visit')+input('標題','title',x.title,'text','required')+input('數值／結果（選填）','value',x.value)+area('備註','notes',x.notes));setForm(async d=>change('health',id?'update':'insert',{cat_id:selected,type:d.type,recorded_at:atDate(d.date),title:d.title,value:d.value,notes:d.notes},id))}
function statsPage(){let days=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-6+i);return localDate(d)});return `<h2>最近七日統計</h2><div class="card">${days.map(d=>{let x=todayData(d);return `<div class="entry"><div class="row"><b>${d}</b><span>${fmt(x.kcal)} kcal · ${fmt(x.foodWater+x.drink)} mL</span></div><small>餐次 ${x.meals.length}｜保健品 ${x.logs.length}｜刷牙 ${x.dental?.completed?'✓':'—'}</small></div>`}).join('')}<p class="notice">數據僅依已輸入紀錄計算，不代表醫療建議。</p></div>`}
(async()=>{const {data:d,error}=await db.auth.getSession();if(error)toast(error.message,true);if(d?.session?.user)await signedIn(d.session.user);else authPage();db.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){user=null;authPage()}})})();

</script></body></html>
