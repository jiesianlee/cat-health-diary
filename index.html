<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>貓咪健康日記</title><style>:root{--blue:#86a9c1;--ink:#39454b;--cream:#f8f5ee;--soft:#eef2f2}*{box-sizing:border-box}body{margin:0;background:#e9e8e3;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif}.app{max-width:480px;min-height:100dvh;margin:auto;background:var(--cream);padding:22px 18px 100px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:23px;letter-spacing:2px;margin:8px 0 20px}h2{font-size:19px;margin:6px 0 14px}.muted{color:#879096;font-size:13px}.cats{display:flex;gap:14px;overflow-x:auto;padding:4px 0 18px}.cat{min-width:70px;text-align:center;border:0;background:none;color:inherit}.cat img{width:66px;height:66px;border-radius:50%;object-fit:cover;border:3px solid transparent}.cat.active img{border-color:#76a7c9}.cat span{display:block;margin-top:4px}.plus{width:66px;height:66px;border-radius:50%;background:#e6edf1;display:grid;place-items:center;font-size:30px;color:#6f9ab6}.hero{display:flex;gap:15px;align-items:center;margin-bottom:15px}.hero img{width:46%;aspect-ratio:1/1.2;object-fit:cover;border-radius:20px}.hero strong{font-size:26px}.card{background:white;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 4px 16px #65727c10}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{background:#f3f6f7;border-radius:15px;padding:14px;text-align:center}.stat b{font-size:23px}.bar{height:10px;background:#e6ebed;border-radius:20px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:#9fc0d9;width:0}.bar.peach i{background:#e8bb93}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);background:#fffdf9;display:flex;justify-content:space-around;padding:10px 4px max(12px,env(safe-area-inset-bottom));box-shadow:0 -3px 18px #0000000b}.nav button{border:0;background:transparent;color:#7f8588;font-size:12px;padding:8px 10px;border-radius:12px}.nav button.on{background:#e6eff4;color:#477fa5}.nav em{display:block;font-size:22px;font-style:normal}button.primary{border:0;border-radius:30px;background:var(--blue);color:white;padding:13px 20px;font-size:15px;width:100%;margin-top:12px}button.small{border:0;border-radius:15px;background:#e8eff3;padding:9px 12px;color:#497a9c}input,select,textarea{width:100%;padding:12px;border:1px solid #d9dfe0;border-radius:12px;background:white;font-size:16px;margin:5px 0 13px}label{font-size:14px;display:block}.entry{border-bottom:1px solid #edf0f1;padding:12px 0}.entry:last-child{border:0}.hidden{display:none}.notice{font-size:12px;color:#8c9397;line-height:1.7}.pill{display:inline-block;padding:5px 10px;background:#e9f0f3;border-radius:15px;font-size:12px}.empty{padding:22px;text-align:center;color:#8b969b}.section-title{font-size:14px;color:#879096;margin:20px 0 8px}.delete{border:0;background:none;color:#ad7e7e;font-size:12px}
.auth-box{max-width:420px;margin:55px auto}.error{color:#a43b3b;font-size:13px;white-space:pre-wrap}.ok{color:#28755a}.nav button{padding:8px 5px;flex:1}.nav em{font-size:20px}.loading{text-align:center;padding:35px}.photo{max-width:100%;max-height:200px;border-radius:12px}.chip{display:inline-block;background:#e9f0f3;border-radius:10px;padding:4px 8px}.row{flex-wrap:wrap}.entry button{margin:2px}textarea{min-height:75px}button:disabled{opacity:.5}#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);max-width:440px;width:90%;background:#39454b;color:white;padding:13px;border-radius:12px;display:none;z-index:1000}#auth{max-width:480px;margin:auto;background:var(--cream);min-height:100dvh;padding:25px}.small-outline{background:white;border:1px solid #cddbe2;color:#477fa5;border-radius:14px;padding:8px 10px}
</style></head><body><div id="toast"></div><div id="auth" style="display:none"></div><main class="app" id="app" style="display:none"><header><h1>貓咪健康日記 🐾</h1><div><button class="small" onclick="manageCats()">多貓管理 ⚙</button> <button class="small" onclick="logout()">登出</button></div></header><div class="cats" id="cats"></div><section id="content"></section></main><nav class="nav" id="nav"></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>

const SUPABASE_PROJECT_URL='https://plwjjqjubpiecenuduvg.supabase.co';
const KEY='sb_publishable_JKRospE3mimBySPLUMlW9Q_RRsiM_Py';
const db=window.supabase.createClient(SUPABASE_PROJECT_URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let user=null, data={}, selected=null, tab='today', careDate=localDate(), loading=false, signed={};
const names={moods:'mood_daily',events:'mood_events',pain:'pain_assessments',medicalV6:'medical_records',labTemplates:'medical_lab_templates',labResults:'medical_lab_results',attachments:'medical_attachments',preferences:'user_preferences',cats:'cats',foods:'foods',meals:'meals',water:'water_records',supplements:'supplements',schedules:'supplement_schedules',logs:'supplement_logs',dental:'dental_records',eliminations:'elimination_records',health:'health_records'};
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=x=>x==null?'—':Number(x).toFixed(1).replace(/\.0$/,'');
function localDate(d=new Date()){let y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
const atDate=(date,time='12:00')=>new Date(`${date}T${time}:00`).toISOString();
const datePart=x=>x?localDate(new Date(x)):'';
const timePart=x=>x?new Date(x).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',hour12:false}):'';
const cat=()=>data.cats?.find(x=>x.id===selected);
const mine=(table)=>data[table]||[];
const forCat=(table)=>mine(table).filter(x=>x.cat_id===selected);
const today=()=>localDate();
const num=(v)=>v===''||v==null?null:Number(v);
function toast(msg,bad=false){let e=$('toast');e.textContent=msg;e.style.background=bad?'#9d5555':'#39454b';e.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>e.style.display='none',4200)}
function busy(on){loading=on;document.querySelectorAll('button.primary').forEach(b=>b.disabled=on)}
async function run(promise){const {data:result,error}=await promise;if(error)throw new Error(error.message);return result}
async function change(table,action,payload,id){busy(true);try{if(action==='insert')await run(db.from(names[table]).insert(payload));else if(action==='update')await run(db.from(names[table]).update(payload).eq('id',id));else if(action==='delete')await run(db.from(names[table]).delete().eq('id',id));await refresh();toast('已儲存至雲端');return true}catch(e){toast('操作失敗：'+e.message,true);return false}finally{busy(false)}}
async function refresh(){if(!user)return;try{let pairs=await Promise.all(Object.entries(names).map(async([k,v])=>[k,await run(db.from(v).select('*').order(k==='preferences'?'updated_at':'created_at',{ascending:false}).limit(1500))]));data=Object.fromEntries(pairs);if(!mine('cats').some(c=>c.id===selected))selected=mine('cats')[0]?.id||null;await signPhotos();render()}catch(e){toast('讀取雲端資料失敗：'+e.message,true);render()}}
async function signPhotos(){signed={};let paths=[...mine('cats').map(x=>x.photo_url),...mine('eliminations').map(x=>x.photo_url),...mine('events').map(x=>x.photo_url),...mine('attachments').map(x=>x.storage_path),...mine('preferences').map(x=>x.home_image_path)].filter(Boolean);await Promise.all(paths.map(async p=>{let {data:d}=await db.storage.from('cat-photos').createSignedUrl(p,3600);if(d?.signedUrl)signed[p]=d.signedUrl}))}
function photo(path){return signed[path]||''}
function formHTML(title,body,submit='儲存'){return `<div class="card"><h2>${title}</h2><form id="editForm">${body}<button class="primary" type="submit">${submit}</button><button type="button" class="small" onclick="render()">取消</button></form></div>`}
function input(label,name,value='',type='text',more=''){return `<label>${label}<input name="${name}" type="${type}" value="${esc(value??'')}" ${more}></label>`}
function area(label,name,value=''){return `<label>${label}<textarea name="${name}">${esc(value||'')}</textarea></label>`}
function select(label,name,opts,val){return `<label>${label}<select name="${name}">${opts.map(([v,t])=>`<option value="${esc(v)}" ${String(v)===String(val)?'selected':''}>${esc(t)}</option>`).join('')}</select></label>`}
function formData(){return Object.fromEntries(new FormData($('editForm')).entries())}
function setForm(fn){$('editForm').onsubmit=async e=>{e.preventDefault();await fn(formData())}}
function photoInput(){return '<label>照片（選填）<input name="image" type="file" accept="image/jpeg,image/png,image/webp"></label>'}
async function uploadImage(file,folder){if(!file||!file.size)return null;if(file.size>5*1024*1024)throw Error('照片不得超過 5 MB');let im=await createImageBitmap(file);let scale=Math.min(1,1000/Math.max(im.width,im.height));let cv=document.createElement('canvas');cv.width=Math.round(im.width*scale);cv.height=Math.round(im.height*scale);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);let blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',.75));let path=`${user.id}/${folder}/${crypto.randomUUID()}.jpg`;await run(db.storage.from('cat-photos').upload(path,blob,{contentType:'image/jpeg'}));return path}
function authPage(){ $('app').style.display='none';$('nav').style.display='none';$('auth').style.display='block';$('auth').innerHTML=`<div class="auth-box"><h1>貓咪健康日記 🐾</h1><div class="card"><h2>雲端登入</h2><p class="muted">登入後，手機與電腦可同步紀錄。</p><form id="authForm">${input('電子郵件','email','','email','required autocomplete="email"')}${input('密碼（至少 6 個字元）','password','','password','required minlength="6" autocomplete="current-password"')}<button class="primary" name="action" value="login">登入</button><button class="primary" type="button" id="signup" style="background:#a8b9ac">建立新帳號</button><p id="authMsg" class="notice"></p></form></div></div>`;let f=$('authForm');async function submit(signup){let d=new FormData(f),email=String(d.get('email')),password=String(d.get('password'));let {data:res,error}=signup?await db.auth.signUp({email,password}):await db.auth.signInWithPassword({email,password});if(error){$('authMsg').textContent=error.message;return}if(signup&&!res.session){$('authMsg').textContent='註冊成功！請先到電子郵件信箱點選驗證連結，再回來登入。';return}if(res.session)await signedIn(res.session.user)}f.onsubmit=e=>{e.preventDefault();submit(false)};$('signup').onclick=()=>submit(true)}
async function signedIn(u){user=u;$('auth').style.display='none';$('app').style.display='block';$('nav').style.display='flex';await refresh()}
async function logout(){await db.auth.signOut();user=null;data={};selected=null;authPage()}
function render(){if(!user)return;let tabs=[['today','⌂','今日'],['care','▤','照顧紀錄'],['foods','▣','食品庫'],['health','♡','健康'],['medical','♧','醫療'],['stats','▥','統計']];$('nav').innerHTML=tabs.map(([id,icon,label])=>`<button class="${tab===id?'on':''}" onclick="go('${id}')"><em>${icon}</em>${label}</button>`).join('');$('cats').innerHTML=mine('cats').map(c=>`<button class="cat ${selected===c.id?'active':''}" onclick="selectCat('${c.id}')">${photo(c.photo_url)?`<img src="${esc(photo(c.photo_url))}">`:`<span class="plus">🐱</span>`}<span>${esc(c.name)}</span></button>`).join('')+`<button class="cat" onclick="editCat()"><span class="plus">＋</span><span>新增貓咪</span></button>`;$('content').innerHTML=({today:todayPage,care:carePage,foods:foodsPage,health:healthPage,medical:medicalPage,stats:statsPage}[tab])()}
function go(t){tab=t;render()}
function selectCat(id){selected=id;render()}
function manageCats(){$('content').innerHTML=`<h2>多貓管理</h2>${mine('cats').map(c=>`<div class="card row"><b>${esc(c.name)}</b><span><button class="small" onclick="editCat('${c.id}')">編輯</button> <button class="delete" onclick="del('cats','${c.id}')">刪除</button></span></div>`).join('')}<button class="primary" onclick="editCat()">＋ 新增貓咪</button><button class="small" onclick="render()">返回</button>`}
async function del(table,id){if(!confirm('確定刪除此筆資料？刪除後無法復原。'))return;await change(table,'delete',null,id)}
function editCat(id){let x=mine('cats').find(c=>c.id===id)||{};$('content').innerHTML=formHTML(id?'編輯貓咪':'新增貓咪',input('名字','name',x.name,'text','required')+input('年齡（文字）','age',x.age)+input('目前體重 kg','weight',x.weight,'number','step="0.01" min="0"')+photoInput());setForm(async d=>{try{let photo_url=x.photo_url||null;let file=$('editForm').elements.image.files[0];if(file)photo_url=await uploadImage(file,'cats');await change('cats',id?'update':'insert',{name:d.name,age:d.age,weight:num(d.weight),photo_url},id)}catch(e){toast(e.message,true)}})}
function todayData(date=today()){let meals=forCat('meals').filter(x=>datePart(x.eaten_at)===date),water=forCat('water').filter(x=>datePart(x.recorded_at)===date),logs=forCat('logs').filter(x=>datePart(x.used_at)===date),dental=forCat('dental').find(x=>x.record_date===date),elim=forCat('eliminations').filter(x=>datePart(x.recorded_at)===date);return {meals,water,logs,dental,elim,kcal:meals.reduce((s,x)=>s+Number(x.kcal||0),0),foodWater:meals.reduce((s,x)=>s+Number(x.water_ml||0),0),drink:water.reduce((s,x)=>s+Number(x.amount_ml||0),0)}}
function todayPage(){let c=cat();if(!c)return '<div class="card empty">請先新增貓咪，開始記錄健康日記。<br><button class="primary" onclick="editCat()">新增貓咪</button></div>';let d=todayData();return `<div class="hero">${photo(c.photo_url)?`<img src="${esc(photo(c.photo_url))}">`:''}<div><strong>${esc(c.name)}</strong><p class="muted">${esc(c.age||'')}<br>${c.weight_kg||c.weight?fmt(c.weight_kg||c.weight)+' kg':'尚未設定體重'}</p><span class="pill">今天也要好好吃飯</span></div></div><div class="card"><div class="row"><h2>今日攝取摘要</h2><span class="muted">${today()}</span></div><div class="stats"><div class="stat">熱量<br><b>${fmt(d.kcal)}</b><br>kcal</div><div class="stat">水分<br><b>${fmt(d.foodWater+d.drink)}</b><br>mL</div></div><p class="notice">水分包含食物含水量與額外飲水；不是醫療建議攝取量。</p></div><div class="card"><h2>今日照顧進度</h2><div class="entry">飲食：${d.meals.length} 餐</div><div class="entry">額外飲水：${fmt(d.drink)} mL</div><div class="entry">保健品：${d.logs.length} 筆已使用</div><div class="entry">刷牙：${d.dental?.completed?'✓ 已完成':'尚未完成'}</div><div class="entry">尿尿：${d.elim.filter(x=>x.type==='urine').length} 筆／大便：${d.elim.filter(x=>x.type==='stool').length} 筆</div><button class="primary" onclick="careDate=today();go('care')">前往照顧紀錄</button></div>`}
function carePage(){if(!cat())return '<div class="empty">請先新增貓咪</div>';let d=todayData(careDate),fixed=mine('schedules').filter(x=>x.cat_id===selected&&x.is_active);return `<h2>照顧紀錄</h2><div class="card">${input('紀錄日期','careDate',careDate,'date','onchange="setCareDate(this.value)"')}</div><div class="card"><div class="row"><h2>① 飲食紀錄</h2><button class="small" onclick="editMeal()">＋ 新增</button></div>${d.meals.map(x=>`<div class="entry row"><span>${esc(mine('foods').find(f=>f.id===x.food_id)?.name||x.food_name_snapshot||'舊紀錄（食品已刪除）')}<br><small>${fmt(x.grams)} g · ${fmt(x.kcal)} kcal</small></span><button class="delete" onclick="del('meals','${x.id}')">刪除</button></div>`).join('')||'<p class="muted">尚無紀錄</p>'}</div><div class="card"><div class="row"><h2>② 飲水紀錄</h2><button class="small" onclick="editWater()">＋ 新增</button></div><p>額外飲水 ${fmt(d.drink)} mL｜食物水分 ${fmt(d.foodWater)} mL<br><b>合計 ${fmt(d.drink+d.foodWater)} mL</b></p>${d.water.map(x=>`<div class="entry row"><span>${fmt(x.amount_ml)} mL</span><span><button class="small" onclick="editWater('${x.id}')">編輯</button><button class="delete" onclick="del('water','${x.id}')">刪除</button></span></div>`).join('')}</div><div class="card"><div class="row"><h2>③ 保健品紀錄</h2><button class="small" onclick="editLog()">＋ 臨時紀錄</button></div>${fixed.length?fixed.map(x=>{let s=mine('supplements').find(s=>s.id===x.supplement_id),logs=d.logs.filter(l=>l.schedule_id===x.id);return `<div class="entry row"><div><b>${esc(s?.name||'保健品')}</b><br><span class="muted">${esc(x.dose||s?.default_dose||'')}</span></div><label style="display:flex;align-items:center;gap:8px"><input type="checkbox" style="width:auto" ${logs.length?'checked':''} onchange="toggleSupplement('${x.id}',this.checked)">已使用</label></div>`}).join(''):'<p class="muted">尚未設定固定保健品，請至食品庫新增並設定。</p>'}${d.logs.map(x=>`<div class="entry row"><span>${esc(mine('supplements').find(s=>s.id===x.supplement_id)?.name||'保健品')}<br><small>${esc(x.dose||'')} · ${timePart(x.used_at)}</small></span><button class="delete" onclick="del('logs','${x.id}')">刪除</button></div>`).join('')}</div><div class="card"><h2>④ 每日刷牙</h2><label style="display:flex;gap:10px;align-items:center"><input id="brushCheck" type="checkbox" style="width:auto" ${d.dental?.completed?'checked':''} onchange="saveDental()">今日已刷牙</label><p class="muted">${d.dental?.completed_at?'完成時間：'+timePart(d.dental.completed_at):'尚未完成'}</p><label>備註（選填）<textarea id="brushNotes" onblur="saveDental()">${esc(d.dental?.notes||'')}</textarea></label><button class="small" onclick="saveDental()">儲存備註</button></div>`}
function setCareDate(d){careDate=d;render()}
async function saveDental(){let x=forCat('dental').find(x=>x.record_date===careDate),done=$('brushCheck').checked,notes=$('brushNotes').value;let payload={cat_id:selected,record_date:careDate,completed:done,completed_at:done?(x?.completed_at||new Date().toISOString()):null,notes};await change('dental',x?'update':'insert',payload,x?.id)}
async function toggleSupplement(id,checked){let schedule=mine('schedules').find(x=>x.id===id);if(!schedule)return;let old=forCat('logs').filter(x=>x.schedule_id===id&&datePart(x.used_at)===careDate);if(checked&&!old.length)await change('logs','insert',{cat_id:selected,supplement_id:schedule.supplement_id,schedule_id:id,dose:schedule.dose||mine('supplements').find(s=>s.id===schedule.supplement_id)?.default_dose||'',used_at:atDate(careDate,new Date().toTimeString().slice(0,5))});else if(!checked){busy(true);try{for(let x of old)await run(db.from('supplement_logs').delete().eq('id',x.id));await refresh()}catch(e){toast(e.message,true)}finally{busy(false)}}}
function editMeal(){if(!mine('foods').length){toast('請先到食品庫新增食品',true);go('foods');return}$('content').innerHTML=formHTML('新增飲食紀錄',input('日期','date',careDate,'date','required')+select('食品','food_id',mine('foods').map(f=>[f.id,f.name]))+input('實際吃下重量（g）','grams','','number','required min="0.1" step="0.1"'));setForm(async d=>{let f=mine('foods').find(x=>x.id===d.food_id),g=Number(d.grams);await change('meals','insert',{cat_id:selected,food_id:f.id,food_name_snapshot:f.name,eaten_at:atDate(d.date),grams:g,kcal:f.kcal_per_100g==null?null:g*Number(f.kcal_per_100g)/100,water_ml:f.moisture_percent==null?null:g*Number(f.moisture_percent)/100,phosphorus_mg:f.phosphorus_mg_per_100g==null?null:g*Number(f.phosphorus_mg_per_100g)/100,sodium_mg:f.sodium_mg_per_100g==null?null:g*Number(f.sodium_mg_per_100g)/100,protein_g:f.protein_percent==null?null:g*Number(f.protein_percent)/100})})}
function editWater(id){let x=mine('water').find(x=>x.id===id)||{};$('content').innerHTML=formHTML(id?'編輯飲水':'新增飲水',input('日期','date',x.recorded_at?datePart(x.recorded_at):careDate,'date','required')+input('飲水量 mL','ml',x.amount_ml,'number','min="0.1" step="0.1" required'));setForm(async d=>change('water',id?'update':'insert',{cat_id:selected,recorded_at:atDate(d.date),amount_ml:Number(d.ml)},id))}
function foodsPage(){return `<h2>食品庫</h2><div class="card"><div class="row"><h2>食物資料庫</h2><button class="small" onclick="editFood()">＋ 新增</button></div>${mine('foods').map(x=>`<div class="entry"><div class="row"><b>${esc(x.name)}</b><span><button class="small" onclick="editFood('${x.id}')">編輯</button><button class="delete" onclick="del('foods','${x.id}')">刪除</button></span></div><span class="muted">${esc(x.category)} · ${fmt(x.kcal_per_100g)} kcal/100g · 磷 ${fmt(x.phosphorus_mg_per_100g)} mg/100g · 鈉 ${fmt(x.sodium_mg_per_100g)} mg/100g</span></div>`).join('')||'<p class="muted">尚無食品</p>'}</div><div class="card"><div class="row"><h2>保健品資料庫</h2><button class="small" onclick="editSupplement()">＋ 新增</button></div>${mine('supplements').map(s=>`<div class="entry"><div class="row"><b>${esc(s.name)}</b><span><button class="small" onclick="editSupplement('${s.id}')">編輯</button><button class="delete" onclick="del('supplements','${s.id}')">刪除</button></span></div><p class="muted">${esc(s.default_dose||'未設定用量')}</p><button class="small" onclick="editSchedule('${s.id}')">＋ 設定為目前貓咪的固定保健品</button></div>`).join('')||'<p class="muted">尚無保健品</p>'}</div><div class="card"><h2>目前貓咪的固定保健品</h2>${mine('schedules').filter(s=>s.cat_id===selected&&s.is_active).map(s=>`<div class="entry row"><span>${esc(mine('supplements').find(x=>x.id===s.supplement_id)?.name||'保健品')} · ${esc(s.dose||'')}</span><button class="delete" onclick="disableSchedule('${s.id}')">停用</button></div>`).join('')||'<p class="muted">尚未設定</p>'}</div>`}
function normalizeMineral(value,unit,kcal){if(value===''||value==null)return null;let v=Number(value);return unit==='percent'?v*1000:unit==='per100kcal'?(Number(kcal)>0?v*Number(kcal)/100:null):v}
function editFood(id){let x=mine('foods').find(f=>f.id===id)||{};let opts=[['wet','濕食'],['dry','乾飼料'],['treat','點心'],['other','其他']];let units=[['per100g','mg / 100g'],['per100kcal','mg / 100kcal'],['percent','%']];$('content').innerHTML=formHTML(id?'編輯食品':'新增食品',input('食品名稱','name',x.name,'text','required')+select('分類','category',opts,x.category||'wet')+input('熱量 kcal / 100g','kcal',x.kcal_per_100g,'number','step="any" min="0" required')+input('含水率 %','moisture',x.moisture_percent,'number','step="any" min="0" max="100"')+input('蛋白質 %','protein',x.protein_percent,'number','step="any" min="0" max="100"')+input('磷含量','phos',x.phosphorus_mg_per_100g,'number','step="any" min="0"')+select('磷單位','phosUnit',units,'per100g')+input('鈉含量','sodium',x.sodium_mg_per_100g,'number','step="any" min="0"')+select('鈉單位','sodiumUnit',units,'per100g')+'<p class="notice">編輯時顯示的是換算後的 mg/100g。缺少營養數據請留空，不要填 0。</p>');setForm(async d=>{let ph=normalizeMineral(d.phos,d.phosUnit,d.kcal),so=normalizeMineral(d.sodium,d.sodiumUnit,d.kcal);if((d.phos&&ph===null)||(d.sodium&&so===null)){toast('熱量須大於 0 才能換算 mg/100kcal',true);return}await change('foods',id?'update':'insert',{name:d.name,category:d.category,kcal_per_100g:num(d.kcal),moisture_percent:num(d.moisture),protein_percent:num(d.protein),phosphorus_mg_per_100g:ph,sodium_mg_per_100g:so},id)})}
function editSupplement(id){let x=mine('supplements').find(s=>s.id===id)||{};$('content').innerHTML=formHTML(id?'編輯保健品':'新增保健品',input('名稱','name',x.name,'text','required')+input('預設使用量（例如 1 包）','dose',x.default_dose)+area('備註','notes',x.notes));setForm(async d=>change('supplements',id?'update':'insert',{name:d.name,default_dose:d.dose,notes:d.notes},id))}
function editSchedule(sid){if(!cat()){toast('請先新增貓咪',true);return}let s=mine('supplements').find(x=>x.id===sid);$('content').innerHTML=formHTML('設定每日固定保健品',`<p>${esc(s.name)}</p>`+input('每日用量（文字）','dose',s.default_dose));setForm(async d=>{let existing=mine('schedules').find(x=>x.cat_id===selected&&x.supplement_id===sid);await change('schedules',existing?'update':'insert',{cat_id:selected,supplement_id:sid,dose:d.dose,is_active:true},existing?.id)})}

function healthPage(){if(!cat())return '<div class="empty">請先新增貓咪</div>';let weights=forCat('health').filter(x=>x.type==='weight'),elim=forCat('eliminations');return `<h2>健康紀錄</h2><div class="card"><div class="row"><h2>體重</h2><button class="small" onclick="editWeight()">＋ 新增</button></div>${weights.map(x=>`<div class="entry row"><span>${datePart(x.recorded_at)}　${fmt(x.weight_kg)} kg</span><span><button class="small" onclick="editWeight('${x.id}')">編輯</button><button class="delete" onclick="del('health','${x.id}')">刪除</button></span></div>`).join('')||'<p class="muted">尚無體重紀錄</p>'}</div><div class="card"><h2>排泄紀錄</h2><button class="small" onclick="editElimination('urine')">＋ 尿尿</button> <button class="small" onclick="editElimination('stool')">＋ 大便</button>${elim.map(x=>`<div class="entry"><div class="row"><b>${x.type==='urine'?'尿尿':'大便'} · ${datePart(x.recorded_at)}</b><span><button class="small" onclick="editElimination('${x.type}','${x.id}')">編輯</button><button class="delete" onclick="del('eliminations','${x.id}')">刪除</button></span></div><p class="muted">${esc(x.status||'')} ${esc(x.quantity||'')} ${esc(x.notes||'')}</p>${photo(x.photo_url)?`<img class="photo" src="${esc(photo(x.photo_url))}">`:''}</div>`).join('')||'<p class="muted">尚無紀錄</p>'}</div>`}

function editMedical(id){let x=mine('health').find(x=>x.id===id)||{};$('content').innerHTML=formHTML(id?'編輯醫療紀錄':'新增醫療紀錄',input('日期','date',x.recorded_at?datePart(x.recorded_at):today(),'date','required')+select('類型','type',[['visit','回診'],['lab','檢驗'],['symptom','症狀'],['medication','用藥'],['other','其他']],x.type||'visit')+input('標題','title',x.title,'text','required')+input('數值／結果（選填）','value',x.value)+area('備註','notes',x.notes));setForm(async d=>change('health',id?'update':'insert',{cat_id:selected,type:d.type,recorded_at:atDate(d.date),title:d.title,value:d.value,notes:d.notes},id))}
function statsPage(){let days=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-6+i);return localDate(d)});return `<h2>最近七日統計</h2><div class="card">${days.map(d=>{let x=todayData(d);return `<div class="entry"><div class="row"><b>${d}</b><span>${fmt(x.kcal)} kcal · ${fmt(x.foodWater+x.drink)} mL</span></div><small>餐次 ${x.meals.length}｜保健品 ${x.logs.length}｜刷牙 ${x.dental?.completed?'✓':'—'}</small></div>`}).join('')}<p class="notice">數據僅依已輸入紀錄計算，不代表醫療建議。</p></div>`}

// V6 feature layer: new tables are additive; original records remain accessible.
const v6Types={followup:'回診',checkup:'健檢',acute:'突發疾病',vaccine_dental:'疫苗／洗牙'};
const v6Moods=['開心','平靜','活潑','緊張','焦慮','疲倦','不舒服'];
function v6Date(d){return datePart(d)}
function v6List(key){return forCat(key).slice().sort((a,b)=>String(b.visited_at||b.occurred_at||b.assessed_at||b.record_date||b.created_at).localeCompare(String(a.visited_at||a.occurred_at||a.assessed_at||a.record_date||a.created_at)))}
function v6Action(fn){return async d=>{try{await fn(d)}catch(e){toast(e.message,true)}}}
const v6OldHealthPage=healthPage;
healthPage=function(){let base=v6OldHealthPage();if(!cat())return base;let mood=v6List('moods'),events=v6List('events'),pain=v6List('pain');return base+`<div class="card"><div class="row"><h2>每日心情</h2><button class="small" onclick="v6EditMood()">＋ 記錄</button></div>${mood.slice(0,15).map(x=>`<div class="entry row"><span>${esc(x.record_date)} · ${esc(x.mood)}<br><small>${esc(x.notes||'')}</small></span><button class="small" onclick="v6EditMood('${x.id}')">編輯</button></div>`).join('')||'<p class="muted">尚無心情紀錄</p>'}</div><div class="card"><div class="row"><h2>特殊事件日記</h2><button class="small" onclick="v6EditEvent()">＋ 新增</button></div>${events.slice(0,20).map(x=>`<div class="entry"><div class="row"><b>${esc(x.event_type)}</b><button class="small" onclick="v6EditEvent('${x.id}')">編輯</button></div><small>${esc(v6Date(x.occurred_at))} ${esc(timePart(x.occurred_at))}</small><p>${esc(x.notes||'')}</p>${photo(x.photo_url)?`<img style="max-width:150px;border-radius:10px" src="${esc(photo(x.photo_url))}">`:''}</div>`).join('')||'<p class="muted">尚無事件</p>'}</div><div class="card"><div class="row"><h2>貓咪疼痛表情評估 FGS</h2><button class="small" onclick="v6EditPain()">＋ 評估</button></div><p class="notice">觀察耳朵、眼睛、口鼻、鬍鬚及頭部位置，各 0–2 分。分數僅供記錄與溝通，不可取代獸醫診斷；若貓咪疑似疼痛，請聯絡獸醫。</p><button class="small" onclick="v6PainGuide()">查看五項觀察說明與肢體語言</button>${pain.slice(0,12).map(x=>`<div class="entry row"><span>${esc(v6Date(x.assessed_at))} · ${x.total_score}/10 分<br><small>${esc(x.notes||'')}</small></span><button class="delete" onclick="del('pain','${x.id}')">刪除</button></div>`).join('')||'<p class="muted">尚無評估</p>'}</div>`};
function v6EditMood(id){let x=mine('moods').find(x=>x.id===id)||{};$('content').innerHTML=formHTML('每日心情',input('日期','date',x.record_date||today(),'date','required')+select('心情','mood',v6Moods.map(v=>[v,v]),x.mood||'平靜')+area('觀察到的行為','observed_behavior',x.observed_behavior)+area('備註','notes',x.notes));setForm(v6Action(async d=>{let old=forCat('moods').find(m=>m.record_date===d.date);await change('moods',id||old?'update':'insert',{cat_id:selected,record_date:d.date,mood:d.mood,observed_behavior:d.observed_behavior,notes:d.notes},id||old?.id)}))}
function v6EditEvent(id){let x=mine('events').find(x=>x.id===id)||{};$('content').innerHTML=formHTML('特殊事件日記',input('日期','date',v6Date(x.occurred_at)||today(),'date','required')+input('時間','time',timePart(x.occurred_at)||'12:00','time','required')+input('事件名稱','event_type',x.event_type,'text','required')+area('觀察行為','observed_behavior',x.observed_behavior)+area('推測心情','interpreted_mood',x.interpreted_mood)+area('日記內容','notes',x.notes)+photoInput());setForm(v6Action(async d=>{let path=x.photo_url||null,f=$('editForm').elements.image.files[0];if(f)path=await uploadImage(f,'mood-events');await change('events',id?'update':'insert',{cat_id:selected,occurred_at:atDate(d.date,d.time),event_type:d.event_type,observed_behavior:d.observed_behavior,interpreted_mood:d.interpreted_mood,notes:d.notes,photo_url:path},id)}))}
function v6PainGuide(){$('content').innerHTML=`<div class="card"><h2>FGS 五項表情觀察</h2><p>每項 0 分為無明顯疼痛表情，1 分為中間狀態，2 分為明顯變化。</p><div class="entry"><b>耳朵</b>：向前 → 稍向外 → 扁平、向外旋轉。</div><div class="entry"><b>眼睛</b>：睜開 → 半瞇 → 明顯瞇眼。</div><div class="entry"><b>口鼻</b>：放鬆圓潤 → 輕微緊繃 → 明顯緊繃。</div><div class="entry"><b>鬍鬚</b>：自然放鬆 → 略改變 → 僵硬、向前或聚攏。</div><div class="entry"><b>頭部</b>：高於肩線 → 接近肩線 → 低於肩線或下垂。</div><h2>其他肢體語言</h2><p>耳朵向後、尾巴快速甩動、身體蜷縮、躲藏或活動量改變，都可能與壓力、不適或環境有關，不能單獨判斷疼痛。</p><p class="notice">這是文字觀察指引，非官方 FGS 圖片量表。請避免只依分數自行決定用藥或延後就醫。</p><button class="primary" onclick="v6EditPain()">開始評估</button><button class="small" onclick="render()">返回</button></div>`}
function v6EditPain(){let keys=[['ears','耳朵'],['orbital_tightening','眼睛'],['muzzle_tension','口鼻'],['whiskers','鬍鬚'],['head_position','頭部位置']];$('content').innerHTML=formHTML('貓咪疼痛表情評估',input('日期','date',today(),'date','required')+input('時間','time',new Date().toTimeString().slice(0,5),'time','required')+keys.map(([k,v])=>select(v,k,[[0,'0 · 無明顯變化'],[1,'1 · 輕微／中間狀態'],[2,'2 · 明顯變化']],0)).join('')+area('觀察備註','notes','')+'<p class="notice">分數僅作為追蹤紀錄，不能取代獸醫診斷。</p>');setForm(v6Action(async d=>{let payload={cat_id:selected,assessed_at:atDate(d.date,d.time),notes:d.notes};keys.forEach(([k])=>payload[k]=Number(d[k]));await change('pain','insert',payload)}))}
const v6OldMedical=medicalPage;
medicalPage=function(){if(!cat())return '<div class="empty">請先新增貓咪</div>';let list=v6List('medicalV6');return `<h2>醫療紀錄</h2><div class="card"><button class="primary" onclick="v6EditMedical()">＋ 新增醫療紀錄</button> <button class="small" onclick="v6EditTemplate()">檢驗項目設定</button>${list.map(x=>{let results=mine('labResults').filter(r=>r.medical_record_id===x.id),attachments=mine('attachments').filter(a=>a.medical_record_id===x.id);return `<div class="entry"><div class="row"><b>${esc(x.title)}</b><span><button class="small" onclick="v6EditMedical('${x.id}')">編輯</button><button class="small" onclick="v6EditMedical('${x.id}',true)">複製</button><button class="delete" onclick="del('medicalV6','${x.id}')">刪除</button></span></div><small>${esc(v6Date(x.visited_at))} · ${esc(v6Types[x.record_type]||x.record_type)}</small><p>${esc(x.diagnosis||x.notes||'')}</p>${results.map(r=>`<small class="pill">${esc(r.marker_name)} ${fmt(r.result_value)} ${esc(r.unit||'')}</small>`).join(' ')}<div>${attachments.map(a=>photo(a.storage_path)?`<a href="${esc(photo(a.storage_path))}" target="_blank" rel="noopener"><img src="${esc(photo(a.storage_path))}" style="width:85px;height:85px;object-fit:cover;border-radius:8px;margin:4px"></a>`:'').join('')}</div><button class="small" onclick="v6EditLabs('${x.id}')">檢驗數值</button> <button class="small" onclick="v6AddAttachments('${x.id}')">新增照片</button></div>`}).join('')||'<p class="muted">尚無新版醫療紀錄</p>'}</div><div class="card"><h2>舊版醫療紀錄（保留）</h2>${forCat('health').filter(x=>x.type!=='weight').map(x=>`<div class="entry row"><span><b>${esc(x.title||x.type)}</b><br><small>${esc(v6Date(x.recorded_at))} ${esc(x.value||'')}</small><br>${esc(x.notes||'')}</span><button class="small" onclick="editMedical('${x.id}')">編輯</button></div>`).join('')||'<p class="muted">無舊版紀錄</p>'}</div>`};
function v6EditMedical(id,duplicate=false){
 let x=mine('medicalV6').find(x=>x.id===id)||{};
 let clone=duplicate;
 $('content').innerHTML=formHTML(clone?'複製醫療紀錄':id?'編輯醫療紀錄':'新增醫療紀錄',
   input('日期','date',clone?today():v6Date(x.visited_at)||today(),'date','required')+
   select('紀錄類型','record_type',Object.entries(v6Types),x.record_type||'followup')+
   input('標題','title',x.title,'text','required')+
   area('症狀（突發疾病時填寫）','symptoms',clone?'':x.symptoms)+
   area('診斷','diagnosis',clone?'':x.diagnosis)+
   area('備註','notes',clone?'':x.notes));
 setForm(v6Action(async d=>{
   let payload={cat_id:selected,visited_at:atDate(d.date),record_type:d.record_type,title:d.title,
     symptoms:d.record_type==='acute'?d.symptoms:null,diagnosis:d.diagnosis,notes:d.notes};
   if(clone){
     let copied=await run(db.from('medical_records').insert(payload).select('id').single());
     let original=mine('labResults').filter(r=>r.medical_record_id===id);
     if(original.length){
       let copiedLabs=original.map(r=>({cat_id:selected,medical_record_id:copied.id,
         marker_code:r.marker_code,marker_name:r.marker_name,unit:r.unit,
         reference_min:r.reference_min,reference_max:r.reference_max,result_value:null}));
       await run(db.from('medical_lab_results').insert(copiedLabs));
     }
     await refresh();toast('已複製醫療紀錄與檢驗項目；檢驗結果已清空');
   }else{
     await change('medicalV6',id?'update':'insert',payload,id||null);
   }
 }));
}
function v6EditTemplate(id){let x=mine('labTemplates').find(x=>x.id===id)||{};let defaults=[['CREA','肌酸酐'],['BUN','尿素氮'],['BUN/CREA','尿素氮／肌酸酐比值'],['AST','天門冬胺酸轉胺酶'],['ALT','丙胺酸轉胺酶'],['ALKP','鹼性磷酸酶']];$('content').innerHTML=`<div class="card"><h2>檢驗項目範本</h2>${forCat('labTemplates').map(t=>`<div class="entry row"><span>${esc(t.marker_code)} · ${esc(t.marker_name)} ${esc(t.unit||'')}</span><span><button class="small" onclick="v6EditTemplate('${t.id}')">編輯</button><button class="delete" onclick="del('labTemplates','${t.id}')">刪除</button></span></div>`).join('')}<button class="small" onclick="v6AddDefaults()">加入常見檢驗項目</button></div>`+formHTML(id?'編輯項目':'新增自訂項目',input('項目代碼','marker_code',x.marker_code,'text','required')+input('項目名稱','marker_name',x.marker_name,'text','required')+input('單位','unit',x.unit)+input('參考下限','reference_min',x.reference_min,'number','step="any"')+input('參考上限','reference_max',x.reference_max,'number','step="any"'));setForm(v6Action(async d=>{await change('labTemplates',id?'update':'insert',{cat_id:selected,marker_code:d.marker_code.trim(),marker_name:d.marker_name,unit:d.unit,reference_min:num(d.reference_min),reference_max:num(d.reference_max)},id)}))}
async function v6AddDefaults(){let defs=[['CREA','肌酸酐'],['BUN','尿素氮'],['BUN/CREA','尿素氮／肌酸酐比值'],['AST','天門冬胺酸轉胺酶'],['ALT','丙胺酸轉胺酶'],['ALKP','鹼性磷酸酶']];try{let existing=new Set(forCat('labTemplates').map(x=>x.marker_code));let rows=defs.filter(([code])=>!existing.has(code)).map(([marker_code,marker_name])=>({cat_id:selected,marker_code,marker_name}));if(rows.length)await run(db.from('medical_lab_templates').insert(rows));await refresh();v6EditTemplate()}catch(e){toast(e.message,true)}}
function v6EditLabs(recordId){
 let templates=forCat('labTemplates').slice().sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)||a.marker_code.localeCompare(b.marker_code));
 let saved=mine('labResults').filter(x=>x.medical_record_id===recordId);
 let record=mine('medicalV6').find(x=>x.id===recordId);
 if(!record){toast('找不到醫療紀錄',true);return}
 if(!templates.length){$('content').innerHTML=`<div class="card"><h2>檢驗數值</h2><p>這隻貓咪尚未建立檢驗項目。可以一鍵加入常見項目，參考值請依獸醫院報告填寫。</p><button class="primary" onclick="v6InitLabTemplates('${recordId}')">＋ 加入常見檢驗項目</button> <button class="small" onclick="v6EditTemplate()">自訂項目</button></div>`;return}
 let rows=templates.map((t,i)=>{let x=saved.find(r=>r.marker_code===t.marker_code);let v=x?.result_value??'';let lo=x?.reference_min??t.reference_min??'';let hi=x?.reference_max??t.reference_max??'';return `<tr><th style="text-align:left;min-width:110px"><b>${esc(t.marker_code)}</b><br><small>${esc(t.marker_name)}</small></th><td><input aria-label="${esc(t.marker_code)} 檢驗結果" name="val${i}" type="number" step="any" value="${esc(v)}" placeholder="未檢驗" style="min-width:80px;width:100%;box-sizing:border-box"></td><td><input aria-label="${esc(t.marker_code)} 參考下限" name="min${i}" type="number" step="any" value="${esc(lo)}" placeholder="下限" style="min-width:70px;width:100%;box-sizing:border-box"></td><td><input aria-label="${esc(t.marker_code)} 參考上限" name="max${i}" type="number" step="any" value="${esc(hi)}" placeholder="上限" style="min-width:70px;width:100%;box-sizing:border-box"></td><td><input aria-label="${esc(t.marker_code)} 單位" name="unit${i}" value="${esc(x?.unit??t.unit??'')}" placeholder="單位" style="min-width:70px;width:100%;box-sizing:border-box"></td><td><small id="labstatus${i}" class="muted">—</small></td></tr>`}).join('');
 $('content').innerHTML=`<div class="card"><div class="row"><h2>檢驗報告｜${esc(record.title)}</h2><button class="small" onclick="render()">返回</button></div><p class="muted">直接填寫本次檢驗結果。參考上下限會帶入這隻貓咪的設定；若本次檢驗院所不同，可直接修改。未檢驗的項目留白即可。</p><form id="editForm"><div style="overflow-x:auto"><table style="width:100%;border-collapse:separate;border-spacing:5px 10px;font-size:13px"><thead><tr><th>項目</th><th>本次結果</th><th>參考下限</th><th>參考上限</th><th>單位</th><th>狀態</th></tr></thead><tbody>${rows}</tbody></table></div><p class="muted">↑／↓ 僅表示超出輸入的參考區間，不代表疾病診斷。請依獸醫院檢驗報告填寫參考值。</p><button type="submit" class="primary">儲存檢驗結果</button> <button type="button" class="small" onclick="v6EditTemplate()">＋ 新增／管理檢驗項目</button></form></div>`;
 let form=$('editForm');function statuses(){templates.forEach((t,i)=>{let v=form.elements['val'+i].value,lo=form.elements['min'+i].value,hi=form.elements['max'+i].value,el=$('labstatus'+i);if(v===''){el.textContent='—';return}let n=Number(v);el.textContent=lo!==''&&n<Number(lo)?'↓ 偏低':hi!==''&&n>Number(hi)?'↑ 偏高':lo!==''&&hi!==''?'範圍內':'未設定';})}form.addEventListener('input',statuses);statuses();
 form.onsubmit=async e=>{e.preventDefault();try{for(let i=0;i<templates.length;i++){let t=templates[i],old=saved.find(r=>r.marker_code===t.marker_code),v=form.elements['val'+i].value,unit=form.elements['unit'+i].value,lo=form.elements['min'+i].value,hi=form.elements['max'+i].value;if(v===''&&!old)continue;if(lo!==''&&hi!==''&&Number(lo)>Number(hi))throw Error(t.marker_code+' 的參考下限不可大於上限');let payload={cat_id:selected,medical_record_id:recordId,marker_code:t.marker_code,marker_name:t.marker_name,result_value:v===''?null:Number(v),unit,reference_min:lo===''?null:Number(lo),reference_max:hi===''?null:Number(hi)};await run(old?db.from('medical_lab_results').update(payload).eq('id',old.id):db.from('medical_lab_results').insert(payload));if(lo!==''||hi!==''||unit!==t.unit){await run(db.from('medical_lab_templates').update({unit,reference_min:payload.reference_min,reference_max:payload.reference_max}).eq('id',t.id))}}await refresh();toast('檢驗結果已儲存')}catch(err){toast(err.message,true)}};
}
async function v6InitLabTemplates(recordId){let defs=[['CREA','肌酸酐'],['BUN','尿素氮'],['BUN/CREA','尿素氮／肌酸酐比值'],['AST','天門冬胺酸轉胺酶'],['ALT','丙胺酸轉胺酶'],['ALKP','鹼性磷酸酶']];try{let existing=new Set(forCat('labTemplates').map(x=>x.marker_code));let rows=defs.filter(([code])=>!existing.has(code)).map(([marker_code,marker_name])=>({cat_id:selected,marker_code,marker_name}));if(rows.length)await run(db.from('medical_lab_templates').insert(rows));await refresh();v6EditLabs(recordId)}catch(e){toast(e.message,true)}}
function v6AddAttachments(recordId){$('content').innerHTML=formHTML('上傳醫療照片','<label>可選擇多張照片（每張不超過 5MB）<input type="file" name="images" accept="image/jpeg,image/png,image/webp" multiple required></label>');setForm(v6Action(async()=>{let files=Array.from($('editForm').elements.images.files);for(let f of files){let path=await uploadImage(f,'medical');await run(db.from('medical_attachments').insert({cat_id:selected,medical_record_id:recordId,storage_path:path}))}await refresh()}))}
const v6OldToday=todayPage;
todayPage=function(){
  let base=v6OldToday();
  if(!cat())return base;
  const pref=mine('preferences').find(x=>x.user_id===user.id);
  const slogan=pref?.home_slogan||'好好陪你很久很久';
  const editLabel=`<span class="pill" style="display:inline-flex;align-items:center;gap:8px;max-width:100%;white-space:normal"><span>${esc(slogan)}</span><button type="button" onclick="v6EditHome()" aria-label="編輯首頁文字與背景圖片" title="編輯首頁文字與背景圖片" style="border:0;background:transparent;color:inherit;cursor:pointer;font-size:17px;padding:2px 4px">✎</button></span>`;
  base=base.replace('<span class="pill">今天也要好好吃飯</span>',editLabel);
  const bg=photo(pref?.home_image_path);
  if(bg){
    // The uploaded image is the home page backdrop, not an extra content card.
    const safeBg=encodeURI(bg).replace(/'/g,'%27').replace(/\"/g,'%22');
    return `<div class="v6-home-bg" style="background-image:linear-gradient(rgba(248,247,243,.76),rgba(248,247,243,.82)),url('${safeBg}');background-size:cover;background-position:center;background-attachment:scroll;border-radius:22px;padding:12px">${base}</div>`;
  }
  return base;
};
function v6EditHome(){let x=mine('preferences').find(x=>x.user_id===user.id)||{};$('content').innerHTML=formHTML('自訂首頁',input('首頁文字','home_slogan',x.home_slogan||'好好陪你很久很久','text','required')+photoInput());setForm(v6Action(async d=>{let path=x.home_image_path||null,f=$('editForm').elements.image.files[0];if(f)path=await uploadImage(f,'home');await run(db.from('user_preferences').upsert({user_id:user.id,home_slogan:d.home_slogan,home_image_path:path,updated_at:new Date().toISOString()}));await refresh()}))}
let v6StatDays=30,v6StatCategory='overview',v6Start='',v6End='';
function v6StatControl(){let el=$('v6statdays');v6StatDays=el.value==='custom'?'custom':Number(el.value);v6Start=$('v6start').value;v6End=$('v6end').value;render()}
function v6StatTab(c){v6StatCategory=c;render()}
function v6Aggregate(){let end=v6StatDays==='custom'&&v6End?v6End:today(),start=v6StatDays==='custom'&&v6Start?v6Start:localDate(new Date(Date.now()-(Number(v6StatDays)-1)*86400000));let within=d=>{let x=v6Date(d);return x>=start&&x<=end};let rows=[];for(let x of forCat('meals').filter(x=>within(x.eaten_at)))rows.push(['飲食熱量',x.eaten_at,Number(x.kcal||0),'kcal']);for(let x of forCat('meals').filter(x=>within(x.eaten_at)))rows.push(['食物水分',x.eaten_at,Number(x.water_ml||0),'mL']);for(let x of forCat('water').filter(x=>within(x.recorded_at)))rows.push(['額外飲水',x.recorded_at,Number(x.amount_ml||0),'mL']);for(let x of forCat('health').filter(x=>x.type==='weight'&&within(x.recorded_at)))rows.push(['體重',x.recorded_at,Number(x.weight_kg||0),'kg']);for(let x of forCat('dental').filter(x=>within(x.record_date)&&x.completed))rows.push(['刷牙',x.record_date,1,'次']);for(let x of forCat('eliminations').filter(x=>within(x.recorded_at)))rows.push([x.type==='urine'?'尿尿':'大便',x.recorded_at,1,'次']);for(let x of forCat('logs').filter(x=>within(x.used_at)))rows.push(['保健品',x.used_at,1,'次']);for(let x of forCat('moods').filter(x=>within(x.record_date)))rows.push(['心情：'+x.mood,x.record_date,1,'天']);for(let x of forCat('pain').filter(x=>within(x.assessed_at)))rows.push(['FGS 疼痛分數',x.assessed_at,Number(x.total_score),'分']);for(let x of forCat('medicalV6').filter(x=>within(x.visited_at)))rows.push(['醫療紀錄',x.visited_at,1,'次']);for(let x of forCat('events').filter(x=>within(x.occurred_at)))rows.push(['特殊事件',x.occurred_at,1,'次']);for(let x of forCat('labResults')){let m=mine('medicalV6').find(m=>m.id===x.medical_record_id);if(m&&within(m.visited_at)&&x.result_value!=null)rows.push(['檢驗：'+x.marker_code,m.visited_at,Number(x.result_value),x.unit||''])}return {rows,start,end}}
function v6Spark(rows){let points=rows.slice().sort((a,b)=>String(a[1]).localeCompare(String(b[1])));if(points.length<2)return '<p class="muted">需要至少兩筆資料才能呈現趨勢</p>';let vals=points.map(x=>x[2]),min=Math.min(...vals),max=Math.max(...vals),range=max-min||1;let coords=vals.map((v,i)=>`${(i/(vals.length-1)*100).toFixed(1)},${(40-(v-min)/range*34).toFixed(1)}`).join(' ');return `<svg viewBox="0 0 100 46" preserveAspectRatio="none" style="width:100%;height:110px" role="img" aria-label="趨勢折線圖"><polyline fill="none" stroke="#86a9c1" stroke-width="1.5" points="${coords}"/></svg>`}
statsPage=function(){if(!cat())return '<div class="empty">請先新增貓咪</div>';let {rows,start,end}=v6Aggregate(),cats=['overview','food','water','weight','dental','elimination','supplement','mood','medical'],labels=['總覽','飲食','水分','體重','刷牙','排泄','保健品','心情','醫療'];let map={food:['飲食熱量'],water:['食物水分','額外飲水'],weight:['體重'],dental:['刷牙'],elimination:['尿尿','大便'],supplement:['保健品'],mood:['心情：','特殊事件','FGS 疼痛分數'],medical:['醫療紀錄','檢驗：']};let subset=v6StatCategory==='overview'?rows:rows.filter(r=>map[v6StatCategory]?.some(k=>r[0].startsWith(k)));let grouped={};for(let r of subset)(grouped[r[0]]??=[]).push(r);return `<h2>健康統計</h2><div class="card"><label>統計期間<select id="v6statdays" onchange="v6StatControl()">${[[7,'最近 7 天'],[30,'最近 30 天'],[90,'最近 90 天'],['custom','自訂日期']].map(([v,t])=>`<option value="${v}" ${String(v6StatDays)===String(v)?'selected':''}>${t}</option>`).join('')}</select></label><div class="row">${input('起始日期','v6start',start,'date','id="v6start"')}${input('結束日期','v6end',end,'date','id="v6end"')}</div><button class="small" onclick="v6StatDays='custom';v6Start=document.getElementById('v6start').value;v6End=document.getElementById('v6end').value;render()">套用日期</button><p class="muted">${esc(start)} 至 ${esc(end)}</p></div><div class="card" style="display:flex;flex-wrap:wrap;gap:5px">${cats.map((c,i)=>`<button class="small" style="${v6StatCategory===c?'background:#86a9c1;color:white':''}" onclick="v6StatTab('${c}')">${labels[i]}</button>`).join('')}</div>${Object.entries(grouped).map(([name,list])=>{let total=list.reduce((s,r)=>s+r[2],0),unit=list[0][3];return `<div class="card"><h2>${esc(name)}</h2><p><b>${name==='體重'||name.startsWith('檢驗：')?'最新 '+fmt(list.slice().sort((a,b)=>String(b[1]).localeCompare(String(a[1])))[0][2]):fmt(total)}</b> ${esc(unit)}　<span class="muted">${list.length} 筆</span></p>${v6Spark(list)}</div>`}).join('')||'<div class="card muted">此期間尚無相關紀錄</div>'}<p class="notice">統計依照已輸入資料計算。空白與零不同；檢驗數值、體重請以趨勢判讀，不將不同日期數值相加。</p>`};
const v6OldRender=render;
render=function(){v6OldRender();let nav=$('nav');if(!nav)return;let icons={today:'⌂',care:'☷',foods:'▦',health:'♡',medical:'✚',stats:'▥'};nav.querySelectorAll('button').forEach((b,i)=>{let em=b.querySelector('em');if(em)em.textContent=Object.values(icons)[i]||em.textContent})};

(async()=>{const {data:d,error}=await db.auth.getSession();if(error)toast(error.message,true);if(d?.session?.user)await signedIn(d.session.user);else authPage();db.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){user=null;authPage()}})})();

</script></body></html>
